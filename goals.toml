[[goal]]
name = "landing-projected"
source = "README.md: North adds a safe landing path to main; speed targets set 2026-11-06 for north#634"
oracle = "north land profile --since 24h --last 5 --repo north --metric landing-projected"
unit = "s"
max = 20
class = "debt"
ceiling = 60
owner = "tompassarelli/north#641"
revisit = "the projected wait of a lane arriving now, the median service time of the last 5 landings times the tickets queued plus one, stays over 60 s for a week"
pays = ["crates/north-landing/", "crates/north-safe-push/"]

[[goal]]
name = "landing-p90"
source = "README.md: North adds a safe landing path to main; speed targets set 2026-11-06 for north#634"
oracle = "north land profile --since 24h --last 20 --repo north --metric landing-p90"
unit = "s"
max = 60
class = "contract"

[[goal]]
name = "verification-p50"
source = "README.md: North adds a safe landing path to main; speed targets set 2026-11-06 for north#634"
oracle = "north land profile --since 24h --last 20 --repo north --metric verification-p50"
unit = "s"
max = 20
class = "debt"
ceiling = 300
owner = "tompassarelli/north#641"
revisit = "the after-push verification median of the last 20 landings stays over 420 s for a week"
pays = ["crates/north-landing/", "crates/north-safe-push/"]

[[goal]]
name = "laptop-load-15m"
source = "AGENTS.md: builds and suites run under capacity admission; harness/defaults.toml: admission defers on run-queue load against the thread count"
oracle = "cut -d' ' -f3 /proc/loadavg"
unit = "load"
max = 12
class = "debt"
ceiling = 24
owner = "tompassarelli/north#641"
revisit = "the 15-minute load average stays over 24, the laptop's thread count, for a day"

[[goal]]
name = "target-debt-due"
source = "docs/rationale/targets.md: overturned by debt entries piling up unpaid past their triggers"
oracle = "north provenance debt --due | awk -F'\\t' '$1==\"north\"' | wc -l"
unit = "records"
max = 0
class = "debt"
ceiling = 5
owner = "tompassarelli/north#641"
revisit = "a Target-debt record sits unpaid past its trigger for a week"

[[goal]]
name = "main-green"
source = "AGENTS.md: check with cargo test and clippy -D warnings; features.md: a red main is reverted within 15 minutes"
oracle = "gh issue list --repo tompassarelli/north --search 'in:title \"main is red\"' --state open --json title --jq '[.[] | select(.title == \"main is red\")] | length'"
unit = "issues"
max = 0
class = "contract"

[[goal]]
name = "main-green-latest-verdict"
source = "docs/features.md: a red main is reverted within 15 minutes; north#634: the proxy learns of a red main from the lander, not from Tom"
oracle = "awk -F'\\t' '$2==\"north\" && ($4==\"green\" || $4==\"red-main\") {last=$4} END {print (last==\"red-main\") ? 1 : 0}' \"${XDG_STATE_HOME:-$HOME/.local/state}/safe-push/post-land.tsv\""
unit = "red verdicts"
max = 0
class = "contract"

[[goal]]
name = "no-python"
source = "AGENTS.md: the north host is typed Rust; docs/rationale/non-rust-inventory.md"
oracle = "git ls-files '*.py' | wc -l"
unit = "files"
max = 0
class = "contract"

[[goal]]
name = "procedures-valid"
source = "AGENTS.md: north config check for its procedures"
oracle = "north config check >/dev/null 2>&1; echo $?"
max = 0
class = "contract"

[[goal]]
name = "features-index-current"
source = "AGENTS.md: docs/features.md is generated and never edited by hand"
oracle = "north docs features-index --check >/dev/null 2>&1; echo $?"
max = 0
class = "contract"

[[goal]]
name = "layer-terms"
source = "AGENTS.md: use the four layer terms of docs/terms.md; never call a model an agent"
oracle = "{ rg -n -i '\\b(claude|opus|sonnet|haiku|gpt|codex)[ -]agent\\b|\\bagent model\\b|\\bmodel agent\\b' README.md AGENTS.md docs --glob '*.md' || [ $? -eq 1 ]; } | wc -l"
unit = "lines"
max = 0
class = "contract"

[[goal]]
name = "fleet-screen-in-tui"
source = "AGENTS.md: keep fleet screen state and rendering in crates/north-tui/src/tui/fleet"
oracle = "{ rg -l ratatui src crates --glob '*.rs' --glob '!crates/north-tui/**' || [ $? -eq 1 ]; } | wc -l"
unit = "files"
max = 0
class = "contract"

