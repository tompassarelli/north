[[goal]]
name = "landing-p50"
source = "README.md: North adds a safe landing path to main; docs/rationale/landing-latency.md: a clean landing costs about 7 minutes"
oracle = "north land profile --since 24h --repo north --metric landing-p50"
unit = "s"
max = 60
class = "debt"
ceiling = 300
owner = "tompassarelli/north#641"
revisit = "the 24 h queued_at-to-push p50 stays over 60 s for a week"

