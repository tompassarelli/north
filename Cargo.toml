[package]
name = "north"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false
autobins = false

[dependencies]
crossterm = "0.28.1"
ratatui = "0.30.0"
regex = "=1.13.1"
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "serialize"] }
rustix = { version = "0.38", features = ["fs", "process", "stdio"] }
ryu = "=1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
time = "=0.3.55"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["crossterm_0_28"] }

[[bin]]
name = "north"
path = "src/main.rs"

[[bin]]
name = "verify-north"
path = "src/bin/verify_north/main.rs"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "fake_claude"
path = "src/bin/fake_claude.rs"

[profile.dev]
debug = "line-tables-only"
