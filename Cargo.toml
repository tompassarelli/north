[package]
name = "north"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[features]
galileo = ["dep:galileo-runtime", "dep:galileo-core", "dep:galileo-import"]

[dependencies]
galileo-runtime = { git = "https://github.com/tompassarelli/galileo.git", rev = "a12e0edc60e6f4dc13151ec99b4a5e854481e090", optional = true }
galileo-core = { git = "https://github.com/tompassarelli/galileo.git", rev = "a12e0edc60e6f4dc13151ec99b4a5e854481e090", optional = true }
galileo-import = { git = "https://github.com/tompassarelli/galileo.git", rev = "a12e0edc60e6f4dc13151ec99b4a5e854481e090", optional = true }
clause-package = { git = "https://github.com/tompassarelli/clause.git", rev = "258e6956aa11dab2e724e89439e864e5e5dafdd6" }
clause-runtime = { git = "https://github.com/tompassarelli/clause.git", rev = "258e6956aa11dab2e724e89439e864e5e5dafdd6" }
clause-workbench = { git = "https://github.com/tompassarelli/clause.git", rev = "258e6956aa11dab2e724e89439e864e5e5dafdd6" }
arboard = { version = "3", features = ["wayland-data-control"] }
crossterm = "0.28.1"
futures-util = { version = "0.3", features = ["sink"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
ratatui = "0.30.0"
rustix = { version = "0.38", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["crossterm_0_28"] }

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "menu_step"
required-features = ["galileo"]
