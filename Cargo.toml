[package]
name = "north"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[dependencies]
clause-package = { git = "https://github.com/tompassarelli/clause.git", rev = "072290e83484e826bd37a033a00849291568e4e9" }
clause-runtime = { git = "https://github.com/tompassarelli/clause.git", rev = "072290e83484e826bd37a033a00849291568e4e9" }
clause-workbench = { git = "https://github.com/tompassarelli/clause.git", rev = "072290e83484e826bd37a033a00849291568e4e9" }
crossterm = "0.28.1"
ratatui = "0.29.0"
rustix = { version = "0.38", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
