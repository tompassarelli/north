[workspace.dependencies]
crossterm = "0.28.1"
ratatui = "0.30.0"
fancy-regex = "=0.11.0"
regex = "=1.13.1"
percent-encoding = "2.3.2"
base64 = "0.22.1"
ring = "0.17"
rusqlite = { version = "0.41", features = ["backup", "bundled", "functions", "serialize"] }
rustix = { version = "0.38", features = ["fs", "mount", "net", "process", "pty", "stdio", "termios", "thread", "time"] }
ryu = "=1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
tempfile = "3"
time = "=0.3.55"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["crossterm_0_28"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
redundant_clone = "warn"
implicit_clone = "warn"
unnecessary_to_owned = "warn"
redundant_allocation = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
cloned_instead_of_copied = "warn"

[package]
name = "north"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false
