[workspace.dependencies]
crossterm = "0.28.1"
ratatui = "0.30.0"
fancy-regex = "=0.11.0"
regex = "=1.13.1"
percent-encoding = "2.3.2"
base64 = "0.22.1"
ring = "0.17"
rusqlite = { version = "0.41", features = ["backup", "bundled", "functions", "hooks", "serialize"] }
rustix = { version = "0.38", features = ["event", "fs", "mount", "net", "process", "pty", "stdio", "termios", "thread", "time"] }
ryu = "=1.0.23"
serde = { version = "1", features = ["derive"] }
