reason = "starts the dependency box, which a remote worker cannot: bwrap there fails with Can't mount proc on /proc"
test = "it"

[[package.metadata.north.buck.host-cases]]
name = "golden_path::a_brief_becomes_a_worker_commit_that_the_lander_lands_on_main_and_the_records_and_lane_show_it_after_a_stop_that_outwaits_a_slow_client"
reason = "its after-landing run starts the candidate jail, whose mounts a remote worker refuses: bwrap: Failed to make / slave: Operation not permitted"
test = "it"

[[package.metadata.north.buck.host-cases]]
name = "policy_replay_login::a_not_logged_in_sweep_counts_every_run_as_an_error_and_a_token_profile_authenticates_without_exporting_the_token"
reason = "runs two replay sweeps through the north binary, which took 1.5 s to 44.5 s on hosted runners and timed out at the 120 s case limit in run 43702976453 while gex45 runs it in 0.15 to 0.35 s (north#1537)"
test = "it"

[[package.metadata.north.buck.host-cases]]
name = "safe_push::session::a_hung_land_check_times_out_and_fails_the_push"
reason = "waits up to 60 s for a push to exit after its land check passes a 1 s deadline, which on a slowed hosted runner it did not: hosted run 43677630330 failed it after 91 s, while it passes in 0.7 s on a build host (north#1537)"
test = "it"

[[package.metadata.north.buck.host-cases]]
name = "threads_ledger::the_ledger_host_over_ssh_spools_while_down_serves_a_stale_snapshot_and_flushes_in_order"
reason = "reaches a fixture ledger host over ssh and waits on a detached snapshot pull, which on a slowed hosted runner does not land inside the 120 s case limit (north#1578)"
test = "it"

[[package.metadata.north.buck.host-cases]]
name = "threads_resume::an_expired_claim_stays_held_for_its_live_holder_here_and_through_the_ledger_host"
reason = "reaches a fixture ledger host over ssh and waits on a detached snapshot pull, which on a slowed hosted runner does not land inside the 120 s case limit (north#1578)"
test = "it"

[[package.metadata.north.buck.host-cases]]
name = "worker_sandbox::a_candidate_check_or_after_landing_step_cannot_read_the_logins_or_write_the_trusted_mirror_the_lander_queue_records_or_runtimes_and_still_writes_its_checkout_scratch_and_caches_and_nests_a_namespace_south_138"
reason = "runs a candidate check's jail in a bwrap fixture a remote worker cannot set up: bwrap 0.12 opens every parent of a mount point for reading, and a remote worker's build directory parents (/var/lib/buildbarn/worker 0751, its build 0711) are search-only for the runner user, so the fixture home under the build directory cannot be bound: Can't mkdir parents ... Permission denied; and the runner unit's ProtectKernelTunables refuses the proc mount of the new pid namespace the jail and the fixture both make: Can't mount proc on /proc"
test = "it"

