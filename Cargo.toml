[[package.metadata.north.buck.host-cases]]
name = "agent_build_sandbox::an_agent_build_path_reads_no_credential_reaches_no_network_and_refuses_a_remote_buck2_run"
reason = "starts the dependency box or a worker sandbox, which a remote worker cannot: bwrap there fails with Can't mount proc on /proc"
test = "it"

[[package.metadata.north.buck.host-cases]]
