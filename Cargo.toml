name = "worker_sandbox::a_command_confined_to_its_lane_reads_its_lane_and_not_another_project_the_sops_keys_or_agent_state"
reason = "runs a command under north --worker-sandbox in a bwrap fixture a remote worker cannot set up: bwrap 0.12 opens every parent of a mount point for reading, and a remote worker's build directory parents (/var/lib/buildbarn/worker 0751, its build 0711) are search-only for the runner user, so the fixture home under the build directory cannot be bound: Can't mkdir parents ... Permission denied"
