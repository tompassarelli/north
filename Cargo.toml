[package]
name = "north"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
crossterm = "0.28.1"
futures-util = { version = "0.3", features = ["sink"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
ratatui = "0.30.0"
regex = "=1.13.1"
percent-encoding = "2.3.2"
rustix = { version = "0.38", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = "=0.3.55"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["crossterm_0_28"] }

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "menu_step"
test = true
