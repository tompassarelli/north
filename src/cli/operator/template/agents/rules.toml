[[rule]]
id = "report-with-observed-command"
section = "Act and finish"
text = "Report done only with the command you ran and its exit code, and say what remains open."
placement = "global"
fixes = "a done claim with no observed command, which the next reader cannot check"

[[rule]]
id = "ask-only-owner-decisions"
section = "Act and finish"
text = "Ask the owner only about cost, accounts, credentials, making something public, sending in the owner's name, or deleting data that cannot be restored; do everything else yourself."
placement = "global"
fixes = "questions about routine steps the owner already delegated"

[[rule]]
id = "land-each-piece"
section = "Act and finish"
text = "Land each finished piece on its own through safe-push and delete its branch once it has landed."
placement = "global"
fixes = "finished work left unlanded on a branch or in a worktree"

[[rule]]
id = "edit-in-worktrees"
section = "Edits"
text = "Edit in a worktree under the project's worktrees directory, not in its main checkout."
placement = "global"
fixes = "edits made in a main checkout that a concurrent lane can overwrite"

[[rule]]
id = "comments-only-for-constraints"
section = "Edits"
text = "Write no code comments beyond one line naming a constraint a reader would otherwise break."
placement = "global"
fixes = "comments that narrate the code and go stale"

[[rule]]
id = "additions-need-evidence"
section = "Evidence"
text = "Add a scenario, limit, guard, gate or check only for something you can point to: a line in the request, a real report or a reproduced failure."
placement = "global"
fixes = "speculative guards added for futures nobody has reported"

[[rule]]
id = "label-guessed-numbers"
section = "Evidence"
text = "Label a number that has to exist anyway as a guess, and say what would settle it."
placement = "global"
fixes = "guessed numbers presented as measured"

[[rule]]
id = "report-opens-with-outcome"
section = "Reports"
text = "Begin each final report with Done:, Not done:, Split: or Blocked:, and write every file path in full and absolute."
placement = "global"
fixes = "reports that bury the outcome or give relative paths the reader cannot open"
