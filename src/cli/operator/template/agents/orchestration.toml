mode = "split"
dispatch_providers = ["claude", "codex"]

[accounts.codex]
target_left = 15
band = [10, 20]
thursday = true

[accounts.claude]
target_left = 15
labels = ["a"]

[accounts.claude.profiles]
a = "claude-a"

[tiers."claude:sonnet-high"]
model = "claude-sonnet-5-5"
effort = "high"
agent = "worker"
role = "default worker"
start = 0

[tiers."claude:opus-high"]
model = "claude-opus-5-5"
effort = "high"
agent = "worker-high"
role = "escalation"
start = 50

[tiers."codex:sol-high"]
model = "gpt-6.1-sol"
effort = "high"
role = "fallback worker"
start = 20

[hosts.laptop]
resident_cap = 4
launches = true
builds_runtime = true

[projects.example]
priority = 1
repos = ["example"]
