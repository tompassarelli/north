# Every source file that reads text an agent wrote (a Stop: line, a report opener or its prose, issue or comment prose)
# and how many lines do. `kind = "verdict"`: the read decides a bar, an attribution class, a hold or a resume; "hint":
# it only annotates or shows. `all_patterns = true` counts every raw-string pattern in the file, for the files that
# are prose classifiers throughout. tests/it/agent_text_reads.rs refuses a count above its entry and asks to lower an
# entry the code no longer reaches; north#791 replaces each verdict read with its mechanical source and removes the
# entry (docs/rationale/attribution.md).

# The relay drops a turn report whose own Stop: line says it waits on a landing or a clock (north#909): the words can only
# silence a message to the parent, never move a bar, a class or a score, and the queued ticket and registered wait it also reads are mechanical.
[[read]]
file = "crates/north-fleet/src/fleet/upward.rs"
lines = 1
kind = "hint"

[[read]]
file = "crates/north-fleet-supervisor/src/fleet/reaper.rs"
lines = 1
kind = "hint"

[[read]]
file = "crates/north-fleet-supervisor/src/fleet/registry/retiring.rs"
lines = 1
kind = "hint"

[[read]]
file = "crates/north-core/src/grounding/compose.rs"
lines = 1
kind = "hint"

[[read]]
file = "crates/north-core/src/grounding/sources/history.rs"
lines = 1
kind = "hint"

[[read]]
file = "crates/north-guard/src/guard/codex_conduct/stop.rs"
lines = 1
kind = "hint"

[[read]]
file = "crates/north-convo/src/incident_mine/classify.rs"
lines = 3
kind = "hint"


# The report's closing Stop: line is kept in runs.stop to be shown beside the run; no outcome, class or hold reads it (north#872).
[[read]]
file = "crates/north-providers/src/providers/claude/runs/stop.rs"
lines = 1
kind = "hint"
