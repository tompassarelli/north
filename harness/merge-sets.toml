# Files and keys `north merge-driver set` may merge as sets (docs/rationale/landing-train.md, step 9b), and generated files it regenerates.
# Only order-insensitive lists of unique entries belong here; ordered lists such as hook.rs guard arrays never do.
# kind = "lines": every non-comment line is one entry, identified by the text before a trailing " #", or with entry = "first-word" by its first word, so two lines for one key conflict instead of both surviving.
# kind = "block": every line strictly between the first line that trims to `start` and the next that trims to `end` is one entry, identified as in "lines"; git merges the text around the block. With sorted = true the merged block, and a lane's own block at `north land enqueue`, is put in byte order with duplicates dropped.
# kind = "toml-array": the one-line string array under `key` in each table, identified by the table header, its name and the key; entries for one path with different keys merge together.
# kind = "line-inserts": where git's text merge conflicts only because both sides insert lines at one point, and every inserted line matches `pattern`, the lines of both sides are kept, ours first or in byte order when each side's lines are sorted; two lines with one identity (the pattern's first group, else the whole line) conflict. Any other conflicting hunk stays a conflict.
# kind = "table-inserts": as "line-inserts", for inserted whole TOML tables whose `[[header]]` is one of `tables`; only tables whose order no reader depends on belong here, so first-match tables such as [[module]] and [[crate_dag.crate]] never do.
# On one path, "toml-array", "line-inserts" and "table-inserts" entries combine: the arrays merge as sets and the text around them by the insert rules.
# kind = "regenerate": a generated file; the driver leaves it conflicted and `north merge-driver continue` runs `command` on the merged sources, stages it and continues the rebase or cherry-pick. Before its checks the landing candidate also reruns `command` after a lane that changes the generated file or a path under `sources`, and folds the result into that lane, so the file the lander writes replaces whatever the lane committed; `north land enqueue` does not write it and does not refuse a lane that commits it. The build script also writes `src/cli/reference.txt`, `src/cli/verbs.rs` and `structure.toml` from their per-unit trees before the crate compiles, so a lane's own build and checks read the fresh registry without committing it. `generator` lists the paths of the code that writes it: every regeneration runs `./bin/head-north --code GENERATOR`, which uses the running north when it covers that code and builds the tree's own otherwise; a lane behind one that changes a generator in the same candidate and touches that rule's sources or file waits for the next candidate. A kind this north does not know is skipped, and git merges its file as text.

[[set]]
path = "Cargo.toml"
kind = "toml-array"
key = "members"

[[set]]
path = "Cargo.toml"
kind = "toml-array"
key = "default-members"

[[set]]
path = "Cargo.toml"
kind = "line-inserts"
pattern = '^([A-Za-z0-9_-]+)(\.workspace)? = '

[[set]]
path = "src/main.rs"
kind = "line-inserts"
pattern = '^(?:pub )?mod ([a-z0-9_]+);$'

[[set]]
path = "harness/machine-bound-tests"
kind = "lines"

[[set]]
path = "src/cli/help.txt"
kind = "regenerate"
command = "north docs help-index"
sources = ["src/cli/help/"]
generator = ["crates/north-ops/src/ops/docs.rs", "crates/north-ops/src/ops/help_index/"]

[[set]]
path = "src/cli/reference.txt"
kind = "regenerate"
command = "north docs reference-index"
sources = ["src/cli/reference/"]
generator = ["crates/north-ops/src/ops/docs.rs", "crates/north-ops/src/ops/reference_index/", "crates/north-registries/src/"]

[[set]]
path = "src/cli/verbs.rs"
kind = "regenerate"
command = "north docs verbs-index"
sources = ["src/cli/verbs/"]
generator = ["crates/north-ops/src/ops/docs.rs", "crates/north-ops/src/ops/verbs_index/", "crates/north-registries/src/"]

[[set]]
path = "structure.toml"
kind = "regenerate"
command = "north docs structure-index"
sources = ["structure/"]
generator = ["crates/north-ops/src/ops/docs.rs", "crates/north-ops/src/ops/structure_index/", "crates/north-registries/src/"]

[[set]]
path = "docs/rationale/README.md"
kind = "regenerate"
command = "north docs rationale-index"
sources = ["docs/rationale/"]
generator = ["crates/north-ops/src/ops/docs.rs", "crates/north-ops/src/ops/rationale_index/"]

[[set]]
path = "docs/rationale/kinds.toml"
kind = "lines"
entry = "first-word"

[[set]]
path = "tests/it/main.rs"
kind = "lines"

[[set]]
path = "tests/it/crates.txt"
kind = "lines"
entry = "first-word"

[[set]]
path = "crates/north-lander/tests/it/main.rs"
kind = "lines"

[[set]]
path = "tests/land/main.rs"
kind = "lines"

[[set]]
path = "crates/north-ops/src/ops/mod.rs"
kind = "lines"

[[set]]
path = "crates/north-capacity/src/capacity/mod.rs"
kind = "lines"

[[set]]
path = "crates/north-fleet/src/fleet/mod.rs"
kind = "lines"

[[set]]
path = "crates/north-guard/src/guard/mod.rs"
kind = "lines"

[[set]]
path = "crates/north-lander/src/land/commands.rs"
kind = "lines"
