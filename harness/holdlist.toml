# What north must not lose (north#1127, docs/rationale/holdlist.md). One [[hold]] per guarantee: `metric` is what is measured, `budget` the most it may read, `guard` the test, concern, eval or land check that keeps it, `state` whether that guard is in the tree (`live`) or still to be written (`missing`, with the date and reason in `accepted_risk`). A [[hold.also]] names a further guard of the same hold. `north land scan holdlist-guards-resolve` judges a lane that drops a live guard or removes or weakens a hold without a `Holdlist: REASON` commit trailer.

[[hold]]
id = "H1"
what = "The stable channel moves only by deliberate promotion"
metric = "hosts whose runtime differs from the pin"
budget = "0"
guard_kind = "concern"
guard = "stable-pin"
state = "missing"
incidents = ""
accepted_risk = "2026-11-11: guard not yet written; tracked in the second box of this issue"

[[hold]]
id = "H2"
what = "A runtime that breaks the core loop never reaches a second host"
metric = "hosts reached by a failed canary"
budget = "0"
guard_kind = "test"
guard = "a_promotion_that_breaks_a_core_loop_probe_is_rolled_back_with_an_alarm_naming_the_probe"
state = "live"
incidents = ""

[[hold]]
id = "H3"
what = "A deliberate stop of sessions never rolls a runtime back"
metric = "rollbacks caused by ordered stops"
budget = "0"
guard_kind = "test"
guard = "a_session_stopped_by_order_or_refused_by_its_account_limit_is_not_a_runtime_exit"
state = "live"
incidents = ""

[[hold]]
id = "H4"
what = "A rollback target exists and was judged"
metric = "rollbacks onto a deleted or unjudged runtime"
budget = "0"
guard_kind = "test"
guard = "a_rollback_lands_only_on_a_runtime_whose_canary_passed"
state = "live"
incidents = "north#1096"

[[hold.also]]
guard_kind = "test"
guard = "a_runtime_that_goes_live_by_promote_settle_or_update_gets_a_canary_verdict"
state = "live"

[[hold]]
id = "H5"
