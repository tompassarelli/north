# Grok: Tom adds it when he signs in; one more worker-ledger adapter then records its runs.
[models."grok"]
note = "Tom adds the model, effort and plan when he signs in"

# Billing per account and mode (firn#12): plan = spends included plan usage, money = can bill money,
# blocked = unavailable. Routing never auto-selects money; live flags from `agents usage` (credits,
# extra usage, spend) decide whether overflow past the plan bills money right now.
[accounts.claude]
plan = "Claude Max, account plans selected by operator policy"
monthly_price = 200
monthly_total = 500
machines = ["whiterabbit", "nexus"]
account_count = 3
plans = { max-20x = { name = "Claude Max 20x", monthly_price = 200, usage_multiplier = 20 }, max-5x = { name = "Claude Max 5x", monthly_price = 100, usage_multiplier = 5 } }
accounts_note = "account id labels and plan selections live in south and follow the login across machines. Routing picks the account with headroom per tier"
multiple_accounts = "allowed: Tom states Anthropic allows one person several Claude accounts, including separate consumer accounts. The Consumer Terms (effective 8 Oct 2025) forbid sharing an account or making it available to others (section 2) and bypassing protective measures (section 3); none addresses one person holding several paid accounts"
multiple_accounts_source = "Tom, 2026-10-11; https://www.anthropic.com/legal/consumer-terms"
multiple_accounts_checked = 2026-10-11
standard = "plan"
fast = "money"
fast_note = "Pro and Max pay for fast mode from usage credits only, not included in the subscription rate limits, even with plan usage left; needs usage credits turned on (off on Tom's account)"
fast_source = "https://code.claude.com/docs/en/fast-mode"
fast_checked = 2026-10-11
overflow = "blocked"
overflow_note = "work stops at the plan limit unless usage credits / extra usage are turned on, which the live extra_usage and spend flags report; then it bills money (both off on Tom's account)"
overflow_source = "https://code.claude.com/docs/en/fast-mode"
overflow_checked = 2026-10-11
auto_purchase = "off"

[accounts.gemini]
plan = "Google AI Pro"
monthly_price = 20
promo_price = 5
promo_end = 2027-01-11
promo_end_confirmed = false
promo_note = "Tom, 11 Oct: USD 5/month for the next 3 months, then USD 20; the end date is that estimate (agy exposes no billing date and Google's billing page was not read). agents plan prints a `Blocked: decision for Tom:` line from 7 days before it, and agents usage --refresh sends one desktop notification"
standard = "plan"
fast = "blocked"
overflow = "money"
overflow_note = "Google AI credits can cover usage past the plan quota; treated as money"
overflow_source = "https://www.cloudzero.com/blog/google-antigravity-pricing/"
overflow_checked = 2026-10-11
auto_purchase = "unknown"
