[go]
zero_retention_until = "2026-11-30"
source = "https://opencode.ai/docs/go"

[private]
repos = ["south"]

# north fleet dispatch staffs DeepSeek on these hosts, which hold the opencode key, and keeps on Claude every box whose
# issue title or box text matches one of claude_only: credentials, the worker sandbox and its confinement (north#1625), fleet locking (north#1020), a box
# whose own text says a DeepSeek session cannot do it (north#1054), and a box that reads a host's own telemetry, since a
# lane-only session reads no agent state and so opens neither the capacity database nor the watchdog samples (north#259).
# 2026-11-15 (north#1632): cpx62 runs OpenCode launches under the operator login, which holds the opencode key and binary.
[dispatch]
hosts = ["gex45", "cpx62", "cpx62b", "whiterabbit"]
slot_cap = 16
claude_only = ['\bcredentials?\b', '\bsecrets?\b', '\bsops\b', '\bpasswords?\b', '\bkeyring\b', '\bsandbox', '\blandlock\b', '\bconfine', '\block(s|ed|ing)?\b', '\bflock\b', '\bmutex', '\bA DeepSeek session cannot do\b', 'capacity\.db', 'samples\.jsonl']
# claude_only_ignore: text dropped from the subject before claude_only is matched, so the name of a dependency lock file is not the lock word (north#1210).
claude_only_ignore = ['(?:^|[^\w./-])(?:Cargo\.lock|bun\.lockb?|flake\.lock|yarn\.lock|pnpm-lock\.yaml|package-lock\.json|poetry\.lock|Gemfile\.lock|composer\.lock)(?:$|\.(?:$|\W)|[^\w(.])']
