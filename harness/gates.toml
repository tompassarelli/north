# Every gate that can refuse a launch, a push, a landing or a GitHub write is listed here. A new or changed gate lands with mode = "shadow": it logs what it would refuse, and a reviewer reads those would-be refusals for 24 h or 20 decisions before it may refuse. Switching a gate to "enforce" needs a [gate.NAME.review] table with `reviewed` (date), `by`, and `hours` (>= 24) or `decisions` (>= 20); `north land scan gate-shadow` refuses a lane that enforces a gate without one. The scan's own would-be refusals are in $XDG_STATE_HOME/north/gates/gate-shadow.jsonl on each pushing host. Test admission always refuses on every landing path (the owner's test policy, ruled by the coordinator on 2026-11-13; north#729 showed it refusing 136 lanes with 127 landing later in 2026-11-07's shadow window, and it has refused 3 lanes since 22:12 UTC on 2026-11-12: two at safe-push's own admission before enqueue and one lander-ledger row). The landing gates outside build, clippy, tests, secrets, privacy and test admission share one switch instead, `landing_refusals` in harness/defaults.toml, whose would-be refusals are in $XDG_STATE_HOME/north/gates/landing-shadow.jsonl (north#729).

[gate.gate-shadow]
mode = "enforce"

[gate.gate-shadow.review]
reviewed = "2026-11-08"
by = "n706-gateshadow"
decisions = 58

# A proxy launches a worker only on one of the top five issues of `north graph ready` or an issue it filed or edited in a turn answering a message Tom typed (north#734). Would-be refusals: $XDG_STATE_HOME/north/gates/proxy-launch-rank.jsonl on the launching host.
[gate.proxy-launch-rank]
mode = "shadow"

# A lane that drops the test, concern, eval or land check a live hold of harness/holdlist.toml names, or removes a hold or turns it from live to missing with no `Holdlist: REASON` commit trailer (north#1127, docs/rationale/holdlist.md). A hold whose guard is already missing at the merge base refuses nothing. It enforces since the 2026-11-14 review (north#1544).
[gate.holdlist-guards-resolve]
mode = "enforce"

[gate.holdlist-guards-resolve.review]
reviewed = "2026-11-14"
by = "n1544-gates"
issue = "north#1544"
decisions = 362
correct = 1

# A lane that adds a [[turn]] to docs/rationale/discovery-turns.toml and changes more than added lines of docs/rationale/experiments.toml, or changes or removes a recorded turn, is refused (north#1279). Its rows go to $XDG_STATE_HOME/north/gates/turn-scope.jsonl on the host that runs the scan, which with offloaded land checks is gex45, not the lander. The shadow read on gex45 (scoreboard lead's ruling of 2026-11-13) covered 186 decisions over 29 h with no would-be refusal; no lane that added a [[turn]] was scanned in that window, since the one such lane (2026-11-12) landed before the log began. The first lane that adds a [[turn]] after the log began, discovery-turn-1113 (ac5a57bd66..39e72e1c03), passed the scan on the pinned runtime with would_refuse false (2026-11-13), which is the case the shadow did not show.
[gate.turn-scope]
mode = "enforce"

[gate.turn-scope.review]
reviewed = "2026-11-13"
by = "n1279-turn-scope"
hours = 29
decisions = 186

# A north lane whose own build drops a flag or subcommand that a nixos-config unit or script on its origin/main still runs (north#706): `north land scan tool-removal` asks the lane's build for `north PATH --help`. Would-be refusals: $XDG_STATE_HOME/north/gates/peer-invocation.jsonl on the checking host. The 2026-11-10 review read 2150 decisions over 61 h: 2113 in the laptop log through the records mirror (2026-11-08 00:26 to 2026-11-10 06:48 UTC), none a would-be refusal, and 37 on cpx62, one would-be refusal and true: 3b32b3699 dropped `north skill-review-queue` while nixos-config's skill-review-queue module still ran it, though no host enabled that module, so the module is deleted in nixos-config. gex45's and nexus's logs were unreachable from cpx62. The false refusal north#1041 named, `north fleet send --from` missing from its help, was fixed by a40793dcd; a sweep of every nixos-config invocation against the live runtime's help found two more flags accepted but unlisted, `north config agents check-hook-paths --claude` and `north ops check --synthetic`, which their reference lines now name.
[gate.peer-invocation]
mode = "enforce"

[gate.peer-invocation.review]
reviewed = "2026-11-10"
by = "n1041-peer-enforce"
hours = 61
decisions = 2150

# A filed or edited issue's new unticked box that names no backticked `Done when:` command and says neither `Needs:` nor `not before` is refused with a message naming the box and showing how to write one (north#872), since only its own worker can tick it. The 2026-11-09 review read the log on gex45 alone (the laptop's and nexus's logs were unreachable), 2 would-be refusals over 24 h rather than the 20 the box asked for: 1 true (a probe box naming no command) and 1 false (an edit of north#706 that appended a measurement to a box it already held, so the box was not new), fixed by matching held boxes on their opening words instead of the whole line. That review passed on elapsed time alone and was not enough to enforce (north#971). The 2026-11-10 review read 24 decisions: 20 in the laptop log through the records mirror, all correct, and the 4 on gex45 (the 2 above plus 2 probes), 3 correct; nexus refuses a log read over remote-serve, so its log is unread. Neither log has a row since 2026-11-09 while more than 40 issues filed since then hold unrunnable boxes, because the gate read only the text of a Claude shell command and missed every body written to a file, a script or a Rust tool. The gate now judges the body `north gh-session` sends on every fleet gh call, for each provider (north#1041), so the next review reads that layer's rows on every host before the mode goes to enforce. The 2026-11-14 review by the second reviewer read every row the gh-session layer logged since 2026-11-10 (laptop 1,226, gex45 118; nexus holds no log file), 1,342 correct; the 2 false refusals were one edit of north#1076 whose boxes read "Done when" followed by a backticked command with no colon. Whether each refused box was new was checked against GitHub edit history on a 50-row sample; the log holds only would-refuse rows, so wrong passes are not counted.
[gate.unrunnable-box]
mode = "enforce"

[gate.unrunnable-box.review]
reviewed = "2026-11-14"
by = "second-reviewer"
issue = "north#1041"
hosts = ["laptop", "gex45"]
decisions = 1344
correct = 1342

# Each Bash command, hook and MCP server of a fleet worker runs under `north --worker-sandbox` (CLAUDE_CODE_SHELL_PREFIX), a Landlock domain that confines file removal to the worker's own trees (north#706, docs/rationale/worker-sandbox.md). Landlock has no permissive mode, so its shadow review counted canary worker launches made with NORTH_WORKER_SANDBOX=1: 65 Bash commands of the second round (n706-canary2-claims 52, including its safe-push, and n706-canary2-ingest 13), none refused, after the first round's two refusal classes were fixed.
[gate.worker-sandbox]
mode = "enforce"

[gate.worker-sandbox.review]
reviewed = "2026-11-08"
by = "n706-wipe"
decisions = 65

# Phase 2 of docs/rationale/test-selection.md: a Rust change outside every function region selects only the tests whose reached functions refer to the changed item, by the `rust-analyzer scip` index recorded with the coverage map, and the crate closure where the index does not know the line (north#1039). `north graph ask affected` computes it beside the selection that gates and appends both sizes, the extra and the dropped tests to $XDG_STATE_HOME/north/gates/test-selection-proof.jsonl on the asking host.
[gate.test-selection-proof]
mode = "shadow"

# Pre-landing test selection by measured reachability (docs/rationale/test-selection.md, north#1039). Every alone check and after-landing run records the selection that runs as a `selected` line in its outcome, and appends one row to $XDG_STATE_HOME/north/gates/test-selection.jsonl on the checking host with the base, the head, the size of the selection that runs and the tests only the new selection adds, by rule: today `since-map`, the known tests whose reached functions changed between the coverage map's commit and the lane's base (the M..HEAD condition). Those extra tests do not gate yet; the review reads every host's log after 24 h and at least 20 lanes with a non-empty difference.
[gate.test-selection]
mode = "shadow"

# A post-landing culprit search whose base is already red on the failed tests walks back over the landings before it, each probed on the same failed tests, to the first one red where its parent passes, and would revert that earlier lane (north#1039, docs/rationale/test-selection.md "Blame"). Would-be reverts: $XDG_STATE_HOME/north/gates/blame-walk-back.jsonl on the lander host.
[gate.blame-walk-back]
mode = "shadow"

# A tree whose `third-party/BUCK` lags the Cargo build: no target for a package Cargo builds, a target built without a feature Cargo turns on, a target for a package Cargo dropped, or no target under a name a workspace target depends on (north#1115 box 4a, docs/rationale/compile-reuse.md "First-party targets"). `north buck targets --check`, the land check that also holds Cargo.lock and the generated crate targets, reads this mode from the tree it checks. It enforces since the 2026-11-14 review (north#1544).
[gate.buck-targets-drift]
mode = "enforce"

[gate.buck-targets-drift.review]
reviewed = "2026-11-14"
by = "n1544-gates"
issue = "north#1544"
decisions = 613
correct = 1

# A lane that changes a file of trust_boundary_paths in harness/defaults.toml lands only with the review accepts of two distinct reviewer sessions for its patch id (`git patch-id --stable` of base..head, which the lander's rebase keeps), or of one when the change is test files alone or an exact revert (north#1036, `north runtime accept`). Would-be refusals: $XDG_STATE_HOME/north/gates/review-accept.jsonl, keyed by lane head and patch id, on the host that runs the lane's checks before queueing, which every road to the lander runs. It enforces only after a shadow run has named a real lane.
[gate.review-accept]
mode = "shadow"

# A lane that changes a key of .safe-push is judged by the check and landing lines of the landing base's .safe-push, not its own, and lands only with a review accept of its patch id from a reviewer session that did not author it (`north runtime accept`, north#1287). A reviewer named in the commit message grants nothing. Would-be refusals: $XDG_STATE_HOME/north/gates/safe-push-keys.jsonl, keyed by lane head and patch id, on the host that runs the lane's checks before queueing, which every road to the lander runs. It enforces only after a shadow run has named a real lane.
[gate.safe-push-keys]
mode = "shadow"
