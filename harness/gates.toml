# Every gate that can refuse a launch, a push, a landing or a GitHub write is listed here. A new or changed gate lands with mode = "shadow": it logs what it would refuse, and a reviewer reads those would-be refusals for 24 h or 20 decisions before it may refuse. Switching a gate to "enforce" needs a [gate.NAME.review] table with `reviewed` (date), `by`, and `hours` (>= 24) or `decisions` (>= 20); `north land scan gate-shadow` refuses a lane that enforces a gate without one. The scan's own would-be refusals are in $XDG_STATE_HOME/north/gates/gate-shadow.jsonl on each pushing host. The landing gates outside build, clippy, tests, secrets and privacy share one switch instead, `landing_refusals` in harness/defaults.toml, whose would-be refusals are in $XDG_STATE_HOME/north/gates/landing-shadow.jsonl (north#729).

[gate.gate-shadow]
mode = "enforce"

[gate.gate-shadow.review]
reviewed = "2026-11-08"
by = "n706-gateshadow"
decisions = 58

# A proxy launches a worker only on one of the top five issues of `north graph ready` or an issue it filed or edited in a turn answering a message Tom typed (north#734). Would-be refusals: $XDG_STATE_HOME/north/gates/proxy-launch-rank.jsonl on the launching host.
[gate.proxy-launch-rank]
mode = "shadow"

# A lane whose Box: trailer ticks a detector-filed box lands only with its guard's proof (north#706). Would-be refusals: $XDG_STATE_HOME/north/gates/detector-proof.jsonl on the pushing host.
[gate.detector-proof]
mode = "shadow"

# A lane that adds a Rust `//` comment other than one line naming a determinism, engine, Lua or external-format constraint (north#865). It exits 0 and prints "would refuse:" lines in the land check output while in shadow.
[gate.code-comment]
mode = "shadow"

# A north lane whose own build drops a flag or subcommand that a nixos-config unit or script on its origin/main still runs (north#706): `north land scan tool-removal` asks the lane's build for `north PATH --help`. Would-be refusals: $XDG_STATE_HOME/north/gates/peer-invocation.jsonl on the checking host.
[gate.peer-invocation]
mode = "shadow"

# A filed or edited issue's new unticked box that names no backticked `Done when:` command and says neither `Needs:` nor `not before` (north#872), since only its own worker can tick it. Would-be refusals: $XDG_STATE_HOME/north/gates/unrunnable-box.jsonl on the filing host.
[gate.unrunnable-box]
mode = "shadow"

# Each Bash command, hook and MCP server of a fleet worker runs under `north --worker-sandbox` (CLAUDE_CODE_SHELL_PREFIX), a Landlock domain that confines file removal to the worker's own trees (north#706, docs/rationale/worker-sandbox.md). Landlock has no permissive mode, so while in shadow only a canary launch made with NORTH_WORKER_SANDBOX=1 carries it; the review counts canary worker runs and the "Permission denied" removals in their Bash tool results.
[gate.worker-sandbox]
mode = "shadow"

# The graph guards in harness/graph-guards, one gate per guard file and correction class (harness/corrections.toml graph_guard), run after each landing by `north graph guards harness/graph-guards --shadow` (.safe-push). Each would-be refusal is a `would refuse guard NAME:` line in that check's output on the landing host (north#706, north#882).
[gate.graph-guard-dropped-thread]
mode = "shadow"

[gate.graph-guard-unverified-tick]
mode = "shadow"

[gate.graph-guard-duplicate-claim]
mode = "shadow"
