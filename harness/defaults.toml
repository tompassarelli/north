[heavy_peak_charge_runs]
value = 20
allowed = { min = 1, max = 100000 }
unit = "runs of one owner prefix and command shape, every one measured, below which a heavy request keeps its declared cores; at or above it a shape whose every peak stayed under the declared cores is charged its highest peak"
source = "measured: the last 40 land-check heavy runs on the laptop (2026-11-05) peaked at most 4.0 cores, p90 of per-run p90 2.8, mean wall 121 s, yet each was charged 6, so 3 of 5 lander check slots ran while 64 lanes waited and the laptop sat 31% busy; the 6-core floor (8f9546838) stays for shapes that peaked at or above it, because seven rust-port builds charged their 3.49-core p90 reached load 129 on 2026-10-15; since 2026-11-12 a land check is charged land_offload_cpus with its scope held to that charge, so its capped peaks no longer feed this rule (north#1247)"
fallback = "fewer runs, or any run without a measured peak, keep the declared heavy size"
consumers = ["crates/north-capacity-host/src/capacity/host/policy.rs"]

[land_charge_floor_cpus]
value = 2
allowed = { min = 1, max = 64 }
unit = "cores a landing check of a kind with fewer than land_charge_runs passing runs today is charged at least, when the host's land checks of every kind have that many: it is charged the 90th percentile of their mean cores, rounded up, between this floor and land_offload_cpus, while its scope quota stays land_offload_cpus"
source = "measured: a build host on 2026-11-12, after the charge by kind went live, 46 jobs waited with a slot idle at CPU pressure 17-19 (target 40) because 10 land checks were charged 921 core-seconds and used 236, each new kind still charged 8 of 20 cores"
fallback = "fewer passing land-check runs on the host today keep land_offload_cpus"
consumers = ["crates/north-capacity-host/src/capacity/host/policy.rs"]

[land_charge_runs]
value = 5
allowed = { min = 1, max = 100000 }
unit = "passing runs of one kind of landing check (its command less the lane's --code path list) under the lander's own leases on one host in the last day below which it keeps the heavy charge (land_offload_cpus); at or above it that kind is charged the fewest whole cores at which every one of its day's runs, passing or not, would still finish within its deadline less land_charge_deadline_margin"
source = "measured: on 2026-11-12 every offloaded run was charged 8 CPUs, and 3,039 of 7,092 leases never passed 1.5 cores (charged 1,908,000 core-seconds against 1,013,000 used, north#1247); five passing runs in a day are the fewest that show how a command usually runs on that host; the slowest run of the day sets the charge, not a percentile, so a cold-cache run among them raises the charge instead of being outvoted, and more runs only make it safer"
fallback = "fewer passing runs, an unmeasured run or no deadline keep the heavy charge"
consumers = ["crates/north-capacity-host/src/capacity/host/policy.rs"]

[land_charge_deadline_margin]
value = 1.5
allowed = { min = 1, max = 100 }
unit = "factor the deadline of a landing command is divided by before its day's runs, scaled to fewer cores, must fit it: 1.5 leaves a third of the deadline spare"
source = "derived: from land_offload_cpus (north#1247): the 8-CPU heavy charge was set so the whole suite needs 59% of its 300 s deadline floor; a lighter charge keeps every run within 67% of its deadline, and the scaling assumes the run's work spreads over at most the cores it was charged, so the spare third covers a cold cache or a slower host than the day's slowest run"
fallback = "a command that fits no lighter charge keeps the heavy charge"
consumers = ["crates/north-capacity-host/src/capacity/host/policy.rs"]

