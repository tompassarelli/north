allowed = { min = 5, max = 500 }
unit = "read-only tool calls (diagnosis, status checks, landing logs) a proxy may make for one message from Tom before the PreToolUse hook refuses the next one and names the brief to write, the turn going on; Skill loads, reads of the profile's skills, `north work brief new` and `north ... --help` spend none; a launch, send or gate does not refill it, only Tom's next message does"
source = "proxy: on 2026-11-11 between 4:04 and 4:35 AM +07 the proxy made about 50 read-only calls over two of Tom's messages and the streak limit stopped only the second, because an issue edit, a send and a launch each reset its count; the 2026-11-05 day's streaks ran median 5 and 90th percentile 18 (docs/rationale/proxy-role.md section 1), so 25 for a whole message lets a normal one run and stops that trace within its first message (north#1106, 2026-11-11)"
fallback = "none"
consumers = ["crates/north-guard/src/guard/proxy_role.rs"]

