source = "measured: on 2026-11-07 the 936 GiB build host fell from 164 to 147 GiB free at the top of each hour over a day (about 17 GiB a day net) with swings of 100 to 190 GiB from transient jobs, so 40% free leaves about two weeks of net growth before the held line; wide hysteresis replaced trimming just back over one line on 2026-11-07 (north#725)"
fallback = "none: the reaper always applies it"
