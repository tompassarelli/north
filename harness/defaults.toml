source = "proxy: on 2026-11-07 Tom asked the fleet to be bolder; north land gate-stats --since 7d on the lander showed test admission refusing 136 lanes (127 landed later), the language gate 46 (42), the revert guard 33 (21 unchanged after a rebase) and coverage 8, so every refusal outside build, clippy, tests, secrets and privacy goes to shadow for 24 h and earns refusal back with a would-be refusal naming a real fault (north#729, 2026-11-07); test admission left the switch on 2026-11-13 and always refuses, because the owner's test policy states that the landing refuses an added bug test that passes with the lane's changes reverted, a Test-contract category outside the closed list, and over the verification budget a lane adding more tests than it deletes, and the coordinator ruled that these three refuse on every landing path (commit 407b3dcb5d; the 2026-11-07 figure of 136 refused, 127 landed later stays; test admission has refused 3 lanes since 5:12 AM +07 on 2026-11-13: the busy-line and north#1249 stray-files lanes at safe-push's own admission before enqueue, and burn-1249-gpu-r, a lander-ledger row at 22:37Z, 2026-11-13)"
fallback = "any value but enforce reads as shadow"
consumers = ["crates/north-diff-gates/src/landing_refusals.rs"]

[finish_acceptance_in_prequeue]
value = "off"
allowed = { one_of = ["on", "off"] }
unit = "on: a finish call runs a portable acceptance command as one more check of its own run before queueing, on the would-be head's tree in the same build-host slot, and writes the finish record from that check's keyed verdict, so the safe-push it hands the lane to reuses the run; off runs the command alone first and leaves the checks before queueing to safe-push"
source = "prior: one build-host admission per hand-in (north#1036 slice B1, north#1247): the pre-queue check waited 361 s median and 602 s at night for a slot, and a finish call took a second slot for its own check"
fallback = "any value but off reads as on"
consumers = ["crates/north-base/src/platform/finish_record.rs"]

[rebase_compile]
value = "on"
allowed = { one_of = ["on", "off"] }
unit = "on: when the lander picks a lane onto a main that moved since the lane's checks before queueing, and a crate the new main commits changed is one of the lane's crates or in their dependency closure either way, it runs `cargo check --all-targets --locked --offline` over those crates (the workspace when either side changes a manifest, the lock file or a build script) on a build host through the offload, capped at 90 s, and refuses the lane with the compile errors when cargo fails to compile it; any other end leaves the lane to land; off skips the compile"
source = "north#1036 (2026-11-13): main froze red when the lander pushed a lane that compiled against its old base and not against the moved one: one commit added a field to a struct and another, checked on the older main, built it without the field"
fallback = "any value but off reads as on"
consumers = ["crates/north-landing/src/land/rebase_compile.rs"]

[buck2_after_landing]
value = "on"
allowed = { one_of = ["on", "off"] }
unit = "on: beside each after-landing run the lander starts `north land crate-tests after-landing` on the landed head in its own offload slot on a build host, Buck2 tests of the crates that host lists with no Cargo line, and records head, host, exit (0 green, 1 red, 75 no verdict), seconds and the crates it passed under check-timings/buck2-after-landing; nothing decides on it; off starts nothing"
source = "north#1115 box 7b-checkpoint (2026-11-13): with the test line off the hand-in path, Buck2's line gives the fast verdict on the landed commit, apart from the Cargo run after the landing that reverts"
fallback = "any value but off reads as on"
consumers = ["crates/north-landing/src/land/buck2_after.rs"]

[review_holds]
