unit = "cores a land check is charged and its scope may use (CPUQuota and the build and test thread counts), and the free cores (the admission limit less the CPUs committed to batch runs) a host needs to take an offloaded land check"
source = "measured: the capacity records of the 16-thread build host on 2026-11-12 (623 land-check and offloaded land-check runs): the whole-suite check used 870 to 1425 CPU-seconds (1425 cold-cache, 1178 warm; p90 cores 7 to 9 in a 12-CPU scope), every other check at most 761, against the 300 s deadline floor; at 4 CPUs the whole suite needs at least 356 s and would be killed, at 6 238 s (79% of the floor), at 8 178 s (59%) and the heaviest other check 95 s, so the charge and the scope's limit are 8; a check scoped to some packages is still charged 2 CPUs per package from 4 up to this (north#1247). Before: 4 from 300 land-check commands that day, which left out the offloaded whole-suite runs; before that, the newest 856 land-check heavy runs on the laptop (2026-11-05 to 2026-11-06) averaged 2.3 cores, 75% of runs meaned 4.0 or less, p90 of run means 5.7"
fallback = "a host below it takes no offloaded land check, which waits for the local host"
consumers = ["crates/north-capacity/src/capacity/admission/mod.rs", "crates/north-capacity-host/src/capacity/host/mod.rs"]

