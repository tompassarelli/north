value = "build-host"
allowed = { one_of = ["build-host", "lander"] }
unit = "the host class that runs a landing's post-landing work, the runtime follow (promotion), the after-landing gates, the graph ingest and the build-ahead requests: build-host runs it on this host only when this host is a build host (`offload_builds = true` in orchestration), else on the build host `north capacity offload choose` gives, under the operator login at the same checkout path, and skips it with a line in the follow log when none answers; lander runs it on the lander's host"
source = "tom: the owner ruled on 2026-11-16 that his laptop stays the fallback that lands with every server down, so its lander only lands and everything heavier runs on a build host or is skipped (north#1553); measured on the laptop that day: 4 landings in 15 minutes wrote 8,212 MB in agent.slice where the landers run, a 9 s desktop stall followed, and the graph ingest ran 72% of wall time"
fallback = "any value but lander reads as build-host"
consumers = ["crates/north-landing/src/land/after/follow.rs"]

[seat_stall_trip_seconds]
value = 3
allowed = { min = 1, max = 60 }
unit = "seconds a synced write of the seat probe on the owner's filesystem may stay out before the breaker stops the fleet's laptop units, and the longest one in the last minute past which placement takes no new session on the laptop"
source = "guess: on 2026-11-16 the owner's crash-watch loop, which syncs a line every 2 s, timed 83 stalls of 6 s or more in one hour and none of 4 s or more once the fleet's laptop units stopped (north#1553); the probe's stall log of a week settles it"
fallback = "none: the probe and placement read it from the bundled defaults"
consumers = ["crates/north-capacity/src/capacity/agent_load.rs"]

[seat_stall_units]
value = ["north-land@*", "north-land-rest.*", "north-land-adopt*", "north-runtime-follow.*", "fleet-tick.*", "agents-flow-stall.*", "pace-enforcement.*", "usage-sample.*", "north-watch.*", "laptop-auto.*", "laptop-runner.*", "firn-host-follow.*", "north-land-shadow.*", "harness-health.*", "ssh-master-probe.*"]
allowed = { min_len = 1 }
unit = "systemd user unit patterns of the fleet's units on the laptop that the seat probe's breaker stops on a stall and `north capacity seat-stall resume` starts again: the landers, runtime follow, the fleet tick and the periodic fleet timers with their services; the credential broker, the ssh masters, the capacity watchdog and the sessions' own scopes stay out, and a slice holding a session is never frozen (decision of 2026-10-15)"
source = "north#1553, coordinator's measurement of 2026-11-16: with these units stopped on the laptop, device writes fell from a mean of 1,287 a second to a median of 7 and no stall of 4 s or more followed"
fallback = "an empty list keeps the probe from starting and says so"
consumers = ["crates/north-capacity/src/capacity/seat_stall/mod.rs"]
