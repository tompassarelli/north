[success_threshold]
value = 80
allowed = { min = 0, max = 100 }
unit = "percent of runs that succeed (threads run_ok)"
source = "measured: flat over {60,70,75,80,85,90}: picked-tier success among runs on the pick 60.1-63.0%, Wilson 95% intervals overlap, n=291-354 of 801 decisions; 80 is tied-best (63.0%, n=354, $0.11/success)"
fallback = "a tier under min_runs runs is unsampled: recommend requires sampled measured costs when no tier passes; routing uses the orchestration.toml band"
consumers = ["crates/north-calibration/src/threads/calibration/mod.rs", "crates/north-pace/src/router/ctx.rs"]

[min_runs]
value = 5
allowed = { min = 1, max = 100000 }
unit = "runs in a cell before its success rate or $ per success counts, and before a tier calibration row applies"
source = "measured: flat over {3,5,8,10}: picked-tier success 61.2-63.0%, Wilson 95% intervals overlap, n=263-380 of 801 decisions; $ per success 0.15 at 3, 0.11 at 5, 0.10 at 8-10 (priced n=75-80)"
fallback = "back off surface, verify, scope, spec to the category cell; recommend reports insufficient evidence without a sampled priced tier"
consumers = ["crates/north-calibration/src/threads/calibration/mod.rs"]

[incumbent_margin]
value = 15
allowed = { min = 0, max = 100 }
unit = "success points a dearer challenger must gain over a cell's incumbent"
source = "measured: flat over {0,5,10,15,20,30}: picked-tier success 59.3-63.2%, Wilson 95% intervals overlap, n=317-354 of 801 decisions; 10-20 tied-best at 62.9-63.2%"
fallback = "with no incumbent the cheapest passing tier is picked"
consumers = ["crates/north-calibration/src/threads/calibration/mod.rs"]

