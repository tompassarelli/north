source = "measured: on 2026-11-10 from 3:55 PM the GPU host read 92 to 99 GiB free and refused launches, because each pass stopped at 94 GiB after taking 0.5 to 2 GiB of caches, until a pass at 4:04 PM took one 38 GiB land slot (94 to 126 GiB); 36 GiB over the line is one warm land slot of margin (north#1036)"
