source = "measured: `north config proxy calls` on the laptop proxy's 2026-11-08 transcript (conversation 1f79cfb7) found 82 read-only streaks since a prompt, launch, send or gate, 2 of them over 15, the longest being the laptop-load turn, so 15 stops that turn and lets the other 80 run; between hand-offs that night ran 22 streaks, median 17, 90th percentile 51, longest 151; the proxy's 2026-11-05 day (docs/rationale/proxy-role.md section 1) ran 281 streaks, median 5 and 90th percentile 18, 42 reaching 15 (north#838)"
fallback = "none"
consumers = ["crates/north-guard/src/guard/proxy_role.rs"]

[break_glass_minutes]
value = 30
allowed = { min = 1, max = 30 }
unit = "minutes one `north fleet break-glass` lifts the proxy's look budget and its refusal of source, host, trace, journal and process-table reads, granted only while the harness measures that workers cannot start (the last two launches failed, or the launch probe exits non-zero)"
source = "north#1106, 2026-11-11: Tom asked for a break-glass path beside the proxy-role table, bounded to 30 minutes so a lifted budget cannot outlast the stall that justified it"
fallback = "none"
consumers = ["crates/north-guard/src/guard/break_glass.rs"]

[proxy_role]
value = [
  { class = "launch", owner = "proxy", what = "start or restaff a fleet session: `north fleet launch|revive|relaunch`" },
  { class = "send", owner = "proxy", what = "message a fleet session: `north fleet send|interrupt`, SendMessage" },
  { class = "ask", owner = "proxy", what = "put a question to a running session: `north fleet ask`" },
  { class = "stop", owner = "proxy", what = "stop or forget a session: `north fleet stop|forget`, TaskStop" },
  { class = "adopt", owner = "proxy", what = "adopt a session as the proxy's child: `north fleet adopt`" },
  { class = "gate", owner = "proxy", what = "open, answer and relay gates: `north gate`" },
  { class = "issue-box", owner = "proxy", what = "read an issue and add, tick or close its boxes: `gh issue view|edit|close`, `north task check`" },
  { class = "status", owner = "proxy", what = "read reports and the status verbs: `north fleet tree|show|accounts`, `north land status`" },
  { class = "placement-look", owner = "proxy", what = "one bounded look to choose where work goes, inside the look budget" },
  { class = "source-read", owner = "worker", what = "read a file under a repository checkout to find a cause (rg, cat, sed, git show, git log -p); budget 0, refused before it runs, `git log --oneline` stays open" },
  { class = "remote-read", owner = "worker", what = "ssh past `north fleet|threads|gate` and the status verbs, or a trace, journal or process table on any host (strace, journalctl, ps, top); budget 0, refused before it runs" },
  { class = "build", owner = "worker", what = "build a repository: cargo, bun, nix, make" },
  { class = "test", owner = "worker", what = "run a repository's tests" },
  { class = "repository-edit", owner = "worker", what = "edit any repository file; the proxy's scratch directory and issue bodies stay its own" },
]
allowed = { min_len = 14 }
unit = "what the proxy does itself (owner proxy) and what it writes a brief and launches a worker for (owner worker), one row per class the proxy-role guard sorts a call into; `north config proxy role` prints it"
source = "tom: the coordinator holds itself to an explicit, harness-enforced standard for what it does itself and what it hands to workers, after it traced four problems by hand in about 50 read-only calls over two messages before staffing anyone (north#1106, 2026-11-11)"
fallback = "an unreadable table leaves the proxy-role guard allowing the call, and `north config proxy role` exits 1 naming the fault"
consumers = ["crates/north-guard/src/guard/proxy_table.rs"]

[proxy_look_budget]
