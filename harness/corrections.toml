# The classes of Tom's corrections, read by `north graph ground distill` (pattern, paraphrase), the
# repeated-correction detector of `north ledger flow detect` (owner, guard) and the fleet tick (guarded_at).
# A correction takes the first class whose pattern matches its typed text; its ledger row keeps the
# paraphrase, never Tom's words. A class seen twice gets one box on its owner proposing the guard.
# When that guard lands, set guarded_at to its landing time (ISO, UTC): a correction of the class
# after it is a recurrence and prints red in the proxy's fleet tick for a week.
# A class may name skill, the harness/skills directory whose rule it corrects: a correction of that class after the skill's
# last review files the skill-review detector's box for the skill.
# Each class names not_structural, why no graph fact holds it.

[[class]]
name = "unanswered"
pattern = '''did (you|u) (answer|reply|respond)|you didn'?t answer|didn'?t answer (my|the) question'''
paraphrase = "Tom said the reply did not answer his question."
owner = "north#641"
guard = "The proxy's Stop hook refuses a final message when Tom's last prompt asked a question and the message's first line answers none of it (no yes, no, number, name or fact in reply to the question's words)."
not_structural = "what a reply answers is in the session's messages, which no graph fact holds"

[[class]]
name = "recommendation-dropped"
pattern = '''whenever you have a rec|(plan|rec\w*) (just )?automatically (becomes|gets)|so it doesn'?t (just )?get lost'''
paraphrase = "Tom asked that a recommendation be filed as an issue and acted on instead of left in the conversation."
owner = "north#641"
guard = "The proxy's Stop hook refuses a message that recommends a change and names no issue box whose text carries it."
not_structural = "a recommendation lives in a session's message; the graph holds issues, not what a reply recommended"

[[class]]
name = "harmful-brief"
pattern = '''(ran|running|run|ordered) (a )?load (test|generator) on (my|the|this) laptop|busy loops on (my|the|this) laptop|(my|the|this) laptop.{0,40}(melting|on fire|frozen|unusable)'''
paraphrase = "Tom said a brief ordered work that harmed his laptop."
owner = "north#523"
skill = "workers"
guard = "`north fleet launch` refuses a brief that orders a load test, soak or benchmark without a Needs: line naming a host other than the laptop."
not_structural = "a brief's orders are launch text that `north fleet launch` reads; the graph holds no brief"

[[class]]
name = "unproven-cause"
pattern = '''(isn'?t|is not) (a|an) (compute|cpu|capacity|load|git|hardware) (issue|problem)|this is a (you|u) (issue|problem)|didn'?t (you|u) just|you were wrong|that'?s (wrong|not (it|right|true))|what \w+ are (you|u) talking about'''
paraphrase = "Tom rejected the cause the reply gave as unproven."
owner = "north#523"
skill = "debugging"
guard = "None: the Stop hook that judged this in prose was deleted (north#719); a recurrence is read from the correction ledger."
not_structural = "a cause is a claim in a reply's prose, which no graph fact records"

[[class]]
name = "manual-not-guarded"
pattern = '''do we not have (a|any) (mechanical|determ\w*)|(is )?(that|this|it)'?s? determ\w* enforced|never (ever,? )?(let|allow) this (to )?happen again'''
paraphrase = "Tom asked why a rule was kept by hand instead of by a deterministic guard."
owner = "north#523"
skill = "agent-policy"
guard = "`north config agents check` refuses a new must or never line in AGENTS.md or a skill that names no enforcing hook, gate or check and carries no prose-only owner issue."
guarded_at = "2026-11-06T21:08:55Z"
not_structural = "which rules lack an enforcing hook is in the instruction files `north config agents check` reads, not in graph facts"

[[class]]
name = "overbuilt"
pattern = '''isn'?t the (easiest|simplest) (pattern|way|answer|fix)|doesn'?t (require|need) spinning up|research project on'''
paraphrase = "Tom said the reply chose a heavier path than the simplest one that works."
owner = "north#523"
skill = "planning"
guard = "Dispatch refuses a plan or design box that adds an agent, service, crate or bake-off without a Simplest: line naming the smallest change that meets its Done when and why it falls short."
guarded_at = "2026-11-06T21:00:47Z"
not_structural = "how heavy a chosen path is lives in a plan's prose, which no graph fact measures"

[[class]]
name = "unevidenced-addition"
pattern = '''what edge cases|what \w+ hardening|(verification|test|security) (\w+ )?(theat(re|er)|paranoia)|(contrived|speculative) (scenario|case|limit|guard|path|test|criteri|check)'''
paraphrase = "Tom said the work added scenarios, limits, guards or checks that nothing real called for."
owner = "north#1335"
guard = "The operator's global rule additions-point-to-evidence: a scenario, limit, guard, gate, fallback, code path or Done-when check is added only for something that can be pointed to (docs/rationale/evidence-for-additions.md)."
guarded_at = "2026-11-13T11:03:03Z"
not_structural = "whether an addition has anything behind it lies in what the request and the diff mean, which no graph fact holds"

[[class]]
name = "ungrounded-design"
pattern = '''under-?specified|not (really )?grounded (on|in)|heavier doesn'?t mean'''
paraphrase = "Tom said the design was not grounded in evidence."
owner = "north#525"
skill = "planning"
guard = "Dispatch refuses a design or plan box whose brief has no Spec: measured line citing a ledger measurement or a docs/references.md entry."
guarded_at = "2026-11-06T21:00:46Z"
not_structural = "the evidence a design cites is brief text that dispatch reads; the graph holds no brief"

[[class]]
name = "stale-or-scaffolding"
pattern = '''still in the (readme|docs?)|barnacles|stale (doc|line|readme)'''
paraphrase = "Tom found stale text or leftover scaffolding that the harness should have removed."
owner = "north#635"
skill = "program-craftsmanship"
guard = "A land check resolves every repository path and doc link named in README.md, AGENTS.md and docs/ and refuses a lane that leaves one pointing at nothing."
guarded_at = "2026-11-06T03:49:20Z"
not_structural = "stale paths are file contents the doc-links land check resolves; the graph holds no doc text"

[[class]]
name = "shallow-fix"
pattern = '''\d+x smarter|re-?worked to be|band-?aid'''
paraphrase = "Tom asked for a deeper fix than the patch proposed."
owner = "north#525"
skill = "debugging"
guard = "Dispatch refuses a restaff of a box whose last attempt failed at the same tier unless the brief names the assumption both attempts shared."
not_structural = "the depth of a fix is a judgement over a patch, and restaff history is in the ledger, not graph facts"

[[class]]
name = "status-not-action"
pattern = '''nothing (is )?(happening|moving|landing)|all i (ever )?(hear|here) (from you|is)|that'?s (actually |actuall )?your response|anything (happening|ahppening)'''
paraphrase = "Tom said the reply reported status instead of acting."
owner = "north#641"
guard = "None: the Stop hook that judged this in prose was deleted (north#719); a recurrence is read from the correction ledger."
not_structural = "reporting instead of acting is behaviour in a reply's text"

[[class]]
name = "pace"
pattern = '''(working|moving|going) (so |too )?slow(ly)?|too slow|(go|be) \d+(-\d+)?x faster|not keeping up|not seeing (enough|any) (urgency|speed|progress)|enough urgency|i need to see (some )?(speed|progress)|time is money|minutes left|pacing (allows|blocks|holds|refuses)|(this|that|the) pac(e|ing) rule'''
paraphrase = "Tom said the work was moving too slowly."
owner = "north#636"
guard = "None: the Stop hook that judged this in prose was deleted (north#719); a recurrence is read from the correction ledger."
not_structural = "a session's speed is wall time in transcripts and the ledger, which no graph fact holds"

[[class]]
name = "tom-as-monitor"
pattern = '''(requiring|making|forcing|using) me (to be )?(your|the) [^.?!\n]{0,40}(alarm|bot|monitor|watchdog)|red for \d+ ?min\w*,? missed'''
paraphrase = "Tom said he had to be the alarm for a fault the harness should have caught itself."
owner = "north#634"
guard = "`north loops check` fails when a main branch stayed red over 10 minutes with neither a sheriff revert nor a fleet tick line naming it, read from the buck2.yml run history."
guarded_at = "2026-11-07T20:58:30Z"
not_structural = "red-main intervals come from the buck2.yml run history `north loops check` reads, not graph facts"

[[class]]
name = "dropped-thread"
pattern = '''let (this|that|it) slip|slip like this|(dropped|lost) the (ball|thread)'''
paraphrase = "Tom said the proxy let a thread that waited on it slip."
owner = "north#636"
guard = "The proxy's fleet tick lists every message that names the proxy as the one waited on and has had no reply for 10 minutes."
not_structural = "a waiting message is in the proxy's thread, and the wording that dropped it is issue text the 24-hour closer reads"

[[class]]
name = "noise-in-report"
pattern = '''(completely|totally|entirely) unnec?ess?ary|waste of tokens|otherwise don'?t say anything'''
paraphrase = "Tom said a line in the report was noise he did not need."
owner = "north#641"
guard = "None: the Stop hook that judged this in prose was deleted (north#719); a recurrence is read from the correction ledger."
not_structural = "noise is behaviour in a report's text"

[[class]]
name = "misrelayed-intent"
paraphrase = "Tom said the reply relayed his intent wrongly."
owner = "north#636"
guard = "A relayed instruction carries Tom's request paraphrase and the worker's first turn echoes its Done when, which the proxy's tick compares against the request."
not_structural = "intent lives in Tom's request and the relayed brief, text the graph does not hold"

[[class]]
name = "low-ambition"
paraphrase = "Tom said the plan was adequate but not ambitious enough."
owner = "north#636"
guard = "The proxy's tick names idle admitted capacity beside the ready box count, so a plan that leaves capacity idle is visible."
not_structural = "ambition is a judgement over a plan, and idle capacity lives in capacity leases, not graph facts"

[[class]]
name = "accepted-slow-path"
paraphrase = "Tom objected to a slow path the harness treated as normal."
owner = "north#634"
guard = "A concern in concerns.toml bounds the step Tom named, so a slow run of it is red instead of normal."
not_structural = "step durations are concerns.toml readings, not graph facts"

[[class]]
name = "unverified-tick"
pattern = '''(ticked|marked|claimed|reported) (it |this |that )?(as )?(done|landed) but|not actually (landed|on main)'''
paraphrase = "Tom found a box ticked done whose commit no check or landing confirmed."
owner = "north#706"
skill = "verification"
guard = "None: the graph guard was deleted (north#1544), since claims hold 12-character shas and landed-at facts 40; a recurrence is read from the correction ledger."
not_structural = "a claim's commit is corroborated only by a landing or a passing check, which a worker can still forge until north#1547 lands"

[[class]]
name = "duplicate-claim"
pattern = '''(two|both|2) (sessions|workers|agents) (are )?(on|working on|doing) the same|duplicate (sessions?|workers?|claims?)'''
paraphrase = "Tom found two sessions holding the same box."
owner = "north#706"
skill = "workers"
guard = "None: the graph guard was deleted (north#1544), since refusing a landing releases no claim; a recurrence is read from the correction ledger."
not_structural = "holders of a box are rows of the threads claims table, which refusing a landing cannot release"
