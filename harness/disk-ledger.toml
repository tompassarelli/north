# Every store north or a project writes on a host's root disk, in the order the lease reaper takes from the ones it trims.
# path is under the home unless absolute; one `*` in a segment matches any run of characters there.
# kind is cache (regenerable: a pass under the held line trims it least recently used first toward the low
# watermark), warm (regenerable but a cold rebuild to lose: trimmed past its budget only under the held line), lane (work in progress: north lane gc retires it once landed or abandoned)
# or state (not regenerable: north never deletes it and only reports its size).
# trim names what keeps the store in bounds: build-slots, cargo-targets, compiler-cache, oldest-entries and land-slots are the lease
# reaper's own passes; any other text names the command or project that does. A store nested in another is counted only in itself.
# A store's budget is its name in the host's [hosts.NAME.disk_budget_gib] in orchestration.toml.

[[store]]
name = "build_offload"
path = ".cache/build-offload"
kind = "cache"
trim = "build-slots"

[[store]]
name = "cargo_target"
path = ".cache/cargo-target*"
kind = "cache"
trim = "cargo-targets"

[[store]]
name = "mutant_sweeps"
