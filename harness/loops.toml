cadence_hours = 24
record = "north/tune/cells.json"

host = "ledger"

[[loop]]
name = "effort"
decision = "the reasoning effort a launch runs at"
sites = ["crates/north-dispatch/src/dispatch/tier.rs", "crates/north-dispatch/src/dispatch/manual.rs", "src/cli/fleet/tier.rs"]
updated_by = "orchestration.toml by hand"
cadence_hours = 24
owner = "north#112 Effort is an arm"

[[loop]]
name = "context-window"
