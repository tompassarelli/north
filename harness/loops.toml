# Every automatic decision north makes, as a learning loop: the decision, the files that make it
# (`sites`), the outcome signal it learns from, what updates it and how often, and the record under
# the state root (XDG_STATE_HOME, else ~/.local/state) whose newest write is its last update, on the
# host `host` names (ledger, lander or here). `north loops check` and `north tune` fail a closed loop
# held on this host whose record is older than twice its cadence or missing; `owner` names the box that closes
# an open loop, which prints but does not fail; `score` names a one-line record under the state root that
# `north loops check` prints beside the loop's verdict. The tests in crates/north-dispatch/src/loops fail
# when a decision site, numeric constant or defaults key behind dispatch, fleet launch, capacity
# admission or the lander is named by no loop and no `[plumbing]` list. See
# docs/rationale/learning-loops.md.

[[loop]]
name = "tier"
decision = "the model tier a box of a category gets from dispatch and north fleet launch"
sites = [
  "crates/north-dispatch/src/dispatch/tier.rs",
  "crates/north-dispatch/src/dispatch/tuned.rs",
  "crates/north-dispatch/src/dispatch/survey.rs",
  "crates/north-dispatch/src/dispatch/manual.rs",
  "crates/north-dispatch/src/dispatch/mod.rs",
  "src/cli/fleet/tier.rs",
]
signal = "ledger cost per kept box with 48 h rework, per arm stamp"
updated_by = "north tune"
cadence_hours = 24
record = "north/tune/cells.json"

host = "ledger"
constants = [
  "crates/north-dispatch/src/dispatch/tuned.rs::FRESH_HOURS",
]

[[loop]]
name = "eta"
decision = "the ETA a dispatched box's brief states"
sites = ["crates/north-dispatch/src/dispatch/grounds.rs"]
signal = "p75 run wall of closed boxes per tier family and category"
updated_by = "north tune"
cadence_hours = 24
record = "north/tune/cells.json"

host = "ledger"
constants = [
  "crates/north-dispatch/src/dispatch/grounds.rs::BUDGET_TIMES",
  "crates/north-dispatch/src/dispatch/grounds.rs::PRIOR_REPORTS",
  "crates/north-dispatch/src/dispatch/grounds.rs::REPORT_CHARS",
]

[[loop]]
name = "budget"
decision = "the dollar budget a dispatched box's brief states"
sites = ["crates/north-dispatch/src/dispatch/grounds.rs"]
signal = "median cost per closed box per tier family and category"
