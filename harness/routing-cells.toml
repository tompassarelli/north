# The model and effort cells a launch may draw (north#939), and every cell it may not, with the
# reason the cell is out. A category draws every model at every effort below unless a row names it.
# Low is an arm for every model (north#1438), so the calibration measures each model's low-effort cell on
# north's own tasks; max stays out of the arm set and is reached only by escalation (north#940).
models = ["haiku", "sonnet", "opus"]
efforts = ["low", "medium", "high", "xhigh"]

[[exclude]]
model = "haiku"
effort = "max"
reason = "its token spend approaches Sonnet medium at a lower effort, which is stronger for the same cost (Tom, 2026-11-08)"

[[exclude]]
model = "sonnet"
effort = "xhigh"
reason = "the workers policy staffs a Sonnet session at low, medium or high effort, so the launcher refuses xhigh"

[[exclude]]
model = "sonnet"
effort = "max"
reason = "its token spend approaches Opus medium at a lower effort, which is stronger for the same cost (Tom, 2026-11-08)"

[[exclude]]
model = "haiku"
categories = ["planning", "review", "performance", "netcode-determinism", "debugging-unknown-cause"]
reason = "category error: these need the reasoning or long-context work a larger model gives, so a Haiku run would spend a box on a cell that cannot keep it"

[[exclude]]
model = "haiku"
scopes = ["cross-module", "cross-repo"]
verifies = ["live-run"]
reason = "a change across modules checked by running the product has a reach the brief cannot fix in advance, and a Haiku run on one such brief was stopped before any work (2026-11-13)"
