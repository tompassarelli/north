[canary "cargo-test"]
	check = workflow cargo.yml test Test
	expect = "shell::tests::shellcmd_quotes_heredocs_and_wrappers_preserve_command_boundaries ... FAILED"
[canary "clippy"]
	check = land cargo clippy --all-targets
	expect = "unnecessary use of `to_string`"
[canary "harness-tests"]
	check = workflow harness.yml test Shell and Python tests
	expect = "::error::harness/lib/tree-north.test.sh failed"
[canary "agent-machinery-tests"]
	check = workflow harness.yml test Agent-machinery tests
	expect = "(fail) generated explicit lifecycle budgets authorize exactly the named actions"
[canary "agent-machinery-check"]
	check = land bun run check
	expect = "non-portable source marker in skills/verification/SKILL.md"
[canary "machine-capacity-build"]
	check = land build-machine-capacity --check
	expect = "machine-capacity.mjs is stale; run build-machine-capacity and commit it"
