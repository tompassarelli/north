[canary "cargo-test"]
	check = workflow cargo.yml test Test
	expect = "foundation::redact::tests::redact_hides_secrets_but_keeps_paths_commit_hashes_and_refs ... FAILED"
[canary "clippy"]
	check = land cargo clippy --all-targets
	expect = "unnecessary use of `to_string`"
[canary "harness-tests"]
	check = workflow harness.yml test Shell and Python tests
	expect = "::error::bin/automation-chrome.test.sh failed"
[canary "portable-skill-check"]
	check = land check harness tree-policy
	expect = "verification: non-portable source marker in agent-machinery/skills/verification/SKILL.md"
