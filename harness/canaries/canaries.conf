[canary "buck2-test"]
	check = command nix develop --no-update-lock-file -c buck2 test //crates/north-foundation/...
	expect = redact_hides_secrets_but_keeps_paths_commit_hashes_and_refs
[canary "clippy"]
	check = command nix develop --no-update-lock-file -c buck2 bxl //lint/clippy.bxl:clippy -- --targets //crates/north-base/...
	expect = "unnecessary use of `to_string`"
[canary "harness-tests"]
	check = workflow harness.yml test Shell and Python tests
	expect = "::error::bin/automation-chrome.test.sh failed"
[canary "portable-skill-check"]
	check = land check harness tree-policy
	expect = "verification: non-portable source marker in harness/skills/verification/SKILL.md"
