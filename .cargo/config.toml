[unstable]
codegen-backend = true
feature-unification = true

# Every package set resolves dependency features as --workspace does, so a -p check reuses the artifacts a workspace check left in its slot.
[resolver]
feature-unification = "workspace"

[profile.dev]
codegen-backend = "cranelift"

[build]
incremental = true

[env]
NORTH_DECISION_LOG = { value = "target/decision-log", relative = true }

# Cranelift lacks llvm.x86.sse2.pmulhu.w, which zmij's float formatting emits.
[profile.dev.package.zmij]
codegen-backend = "llvm"
