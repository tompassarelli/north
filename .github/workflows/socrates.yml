name: Socrates
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'agent-machinery/**'
      - '.github/workflows/socrates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'agent-machinery/**'
      - '.github/workflows/socrates.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Shell and Python tests
        run: |
          mapfile -t tests < <(find bin agent-machinery/hooks -type f \( -name '*.test.sh' -o -name '*.test.py' \) 2>/dev/null | sort)
          if (( ${#tests[@]} == 0 )); then
            echo "No shell or Python tests under bin/ or agent-machinery/hooks/"
            exit 0
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            case "$t" in
              *.sh) bash "$t" || status=1 ;;
              *.py) python3 "$t" || status=1 ;;
            esac
            echo "::endgroup::"
          done
          exit $status
      - name: Install agent-machinery dependencies
        working-directory: agent-machinery
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          fi
      - name: Agent-machinery tests
        working-directory: agent-machinery
        run: bun test
