name: Socrates
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'socrates/**'
      - '.github/workflows/socrates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'socrates/**'
      - '.github/workflows/socrates.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Test tools
        run: |
          sudo apt-get install -y --no-install-recommends ripgrep shellcheck
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          git config --global init.defaultBranch main
          git config --global user.name socrates-ci
          git config --global user.email socrates-ci@example.invalid
      - name: Shell and Python tests
        env:
          NORTH_HOME: ${{ github.workspace }}
        run: |
          # Machine-bound: these need ~/code checkouts, /etc/codex/hooks/runtime, live agent state or shellcheck 0.11; they run locally.
          skip=(
            bin/agents-plan.test.sh bin/worker-ledger.test.sh bin/worker-sweep.test.sh bin/threads.test.sh
            bin/convo.test.sh
            bin/north-session-resolve.test.sh lib/codex/shared-activate.test.py
            bin/pin-retire.test.sh bin/run-bounded.test.sh
            socrates/hooks/heavy-command-guard.test.sh socrates/hooks/launch-critical-worktree-guard.test.sh
            socrates/hooks/launch-critical-worktree-guard.test.py socrates/hooks/lead-regrounding.test.sh
            socrates/hooks/modern-search-guard.test.sh socrates/hooks/native-launch-guard.test.sh
            socrates/hooks/resource-safe-search-guard.test.sh socrates/hooks/spawn-capacity-guard.test.sh
            socrates/hooks/subagent-teardown.test.sh socrates/hooks/tripwire-guard.test.sh
            socrates/hooks/worker-handoff.test.sh socrates/hooks/worker-tier-guard.test.sh
            socrates/hooks/worker-wait-guard.test.sh socrates/hooks/session-kill-guard.test.sh
            socrates/lib/routing.test.sh socrates/scripts/agent-config-check.test.sh socrates/scripts/dep-gate.test.sh
            socrates/skills/todo/scripts/cross-supervisor-mailbox.test.sh socrates/skills/machine-capacity/scripts/machine-capacity.test.sh
          )
          mapfile -t tests < <(find bin lib socrates -type f \( -name '*.test.sh' -o -name '*.test.py' \) 2>/dev/null | sort | grep -vxF -f <(printf '%s\n' "${skip[@]}"))
          if (( ${#tests[@]} == 0 )); then
            echo "No shell or Python tests under bin/, lib/ or socrates/"
            exit 0
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            case "$t" in
              *.sh) bash "$t" || { echo "::error::$t failed"; status=1; } ;;
              *.py) python3 "$t" || { echo "::error::$t failed"; status=1; } ;;
            esac
            echo "::endgroup::"
          done
          exit $status
      - name: Install agent-machinery dependencies
        working-directory: agent-machinery
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          fi
      - name: Agent-machinery tests
        working-directory: agent-machinery
        run: bun test
