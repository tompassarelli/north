name: Socrates
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'socrates/**'
      - '.github/workflows/socrates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'socrates/**'
      - '.github/workflows/socrates.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Test tools
        run: |
          sudo apt-get install -y --no-install-recommends ripgrep shellcheck
          git config --global init.defaultBranch main
          git config --global user.name socrates-ci
          git config --global user.email socrates-ci@example.invalid
      - name: Shell and Python tests
        env:
          NORTH_HOME: ${{ github.workspace }}
        run: |
          skip=(
            bin/agents-plan.test.sh bin/worker-ledger.test.sh bin/worker-sweep.test.sh
            bin/convo.test.sh bin/wc3-login-field.test.sh
            bin/codex-shared-server.test.sh bin/north-session-resolve.test.sh lib/codex/shared-activate.test.py
          )
          mapfile -t tests < <(find bin lib socrates/hooks -type f \( -name '*.test.sh' -o -name '*.test.py' \) 2>/dev/null | sort | grep -vxF -f <(printf '%s\n' "${skip[@]}"))
          if (( ${#tests[@]} == 0 )); then
            echo "No shell or Python tests under bin/, lib/ or socrates/hooks/"
            exit 0
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            case "$t" in
              *.sh) bash "$t" || status=1 ;;
              *.py) python3 "$t" || status=1 ;;
            esac
            echo "::endgroup::"
          done
          exit $status
      - name: Install agent-machinery dependencies
        working-directory: agent-machinery
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          fi
      - name: Agent-machinery tests
        working-directory: agent-machinery
        run: bun test
