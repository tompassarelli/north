name: Cargo
on:
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'flake.nix'
      - 'flake.lock'
      - 'build.rs'
      - '.github/workflows/cargo.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain and cargo cache
        uses: ./.github/actions/rust
      - name: Cargo test environment
        uses: ./.github/actions/cargo-test
      - name: Test
        run: cargo test --locked
