name: Canary
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain and cargo cache
        uses: ./.github/actions/rust
      - name: Cargo test environment
        uses: ./.github/actions/cargo-test
      - name: cargo test catches its planted fault
        run: harness/scripts/canary.sh cargo-test
      - name: clippy catches its planted fault
        if: ${{ !cancelled() }}
        run: harness/scripts/canary.sh clippy
      - name: Portable skill check catches its planted fault
        if: ${{ !cancelled() }}
        run: harness/scripts/canary.sh portable-skill-check
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install harness test tools
        uses: ./.github/actions/harness
      - name: Shell and Python tests catch their planted fault
        run: harness/scripts/canary.sh harness-tests
