name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Final SemVer identity to preflight without publishing
        required: true
        default: v0.1.0
        type: string
      candidate_commit:
        description: Exact commit to preflight without publishing
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: north-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'tompassarelli/north'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_commit || github.ref }}

      - name: Verify authored identity and notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: bash bin/north-release-preflight "$RELEASE_TAG"

      - name: Resolve annotated candidate identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          CANDIDATE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_commit || github.ref }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse "$CANDIDATE_COMMIT^{commit}")"
          test "$candidate_sha" = "$(git rev-parse HEAD^{commit})"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            release_identity="$(
              printf 'object %s\ntype commit\ntag %s\ntagger North release preflight <release-preflight@north.invalid> 0 +0000\n\nNorth %s non-publishing preflight\n' \
                "$candidate_sha" "$RELEASE_TAG" "$RELEASE_TAG" | git mktag
            )"
          else
            release_identity="refs/tags/$RELEASE_TAG"
          fi
          test "$(git cat-file -t "$release_identity")" = tag
          test "$(git rev-parse "$release_identity^{commit}")" = "$candidate_sha"
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_IDENTITY=$release_identity"
          } >> "$GITHUB_ENV"

      - name: Verify exact green main gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse "$RELEASE_IDENTITY^{commit}")"

          exact_green="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$candidate_sha&per_page=1" \
            --jq '.total_count')"
          if (( exact_green < 1 )); then
            echo "::error::no successful main CI run exists for exact release commit $candidate_sha"
            exit 1
          fi

      - name: Refuse gaps in public final release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp | jq 'add')"
          candidate_sha="$(git rev-parse "$RELEASE_IDENTITY^{commit}")"

          exact_green_ci() {
            local revision="$1"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$revision&per_page=1" \
              --jq '.total_count'
          }

          while IFS= read -r existing_tag; do
            [[ "$existing_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ "$existing_tag" == "$RELEASE_TAG" ]] && continue
            first="$(printf '%s\n%s\n' "$existing_tag" "$RELEASE_TAG" | sort -V | head -n 1)"
            if [[ "$first" != "$existing_tag" ]]; then
              echo "::error::cannot publish $RELEASE_TAG after the later public final tag $existing_tag"
              exit 1
            fi
            if ! jq -e --arg tag "$existing_tag" \
              'any(.[]; .tag_name == $tag and (.draft | not) and (.prerelease | not))' \
              <<<"$releases" >/dev/null; then
              echo "::error::earlier final tag $existing_tag has no public final release"
              exit 1
            fi
            existing_sha="$(git rev-parse "refs/tags/$existing_tag^{commit}")"
            if (( $(exact_green_ci "$existing_sha") < 1 )); then
              echo "::error::earlier final tag $existing_tag lacks successful exact-commit main CI"
              exit 1
            fi
          done < <(git tag --list 'v*.*.*')

          (( $(exact_green_ci "$candidate_sha") >= 1 ))

  publish:
    needs: preflight
    if: github.repository == 'tompassarelli/north' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Publish authored source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash bin/north-release-preflight "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "North $RELEASE_TAG" \
            --notes-file ".github/release-notes/$RELEASE_TAG.md"
