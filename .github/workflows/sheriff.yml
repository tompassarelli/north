name: Main is red
on:
  workflow_run:
    workflows: [Cargo, Harness, Canary]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: main-red
  cancel-in-progress: false
jobs:
  sheriff:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
      - name: Toolchain and cargo cache
        uses: ./.github/actions/rust
        with:
          cache-key: cargo-test
          save: 'false'
      - name: Build north
        run: cargo build --locked --bin north
      - name: Confirm or report the failed landing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898183+github-actions[bot]@users.noreply.github.com'
          target/debug/north main-red "$CI_RUN"
