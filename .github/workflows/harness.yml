name: Harness
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'harness/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/harness.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'harness/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/harness.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      slow_browser_download:
        description: Force the automation browser download past its bound to show it fail as its own step with the CDP test skipped
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install harness test tools
        id: tools
        uses: ./.github/actions/harness
        with:
          force-slow-download: ${{ inputs.slow_browser_download && 'true' || 'false' }}
      - name: Shell and Python tests
        env:
          NORTH_HOME: ${{ github.workspace }}
          NORTH_PACE_BIN: ${{ github.workspace }}/target/debug/north
        run: |
          mapfile -t tests < <(find bin lib harness -type f \( -name "*.test.sh" -o -name "*.test.py" \) 2>/dev/null | sort | grep -vxF -f <(grep -v "^#" harness/machine-bound-tests))
          if (( ${#tests[@]} == 0 )); then
            echo "No shell or Python tests under bin/, lib/ or harness/"
            exit 0
          fi
          logs="$RUNNER_TEMP/harness-tests"
          mkdir -p "$logs"
          printf '%s\0' "${tests[@]}" | xargs -0 -P "$(nproc)" -I{} bash -c '
            log="$0/$(printf %s "$1" | tr / _)" start=$SECONDS
            case "$1" in *.sh) timeout -k 10 300 bash "$1" ;; *.py) timeout -k 10 300 python3 "$1" ;; esac >"$log.log" 2>&1
            status=$?; echo "$status" >"$log.status"
            printf "%s exit %s after %ss\n" "$1" "$status" "$((SECONDS - start))"' "$logs" {}
          status=0
          for t in "${tests[@]}"; do
            log="$logs/$(printf %s "$t" | tr / _)"
            echo "::group::$t"
            cat "$log.log"
            echo "::endgroup::"
            case "$(cat "$log.status")" in 0) ;; 124|137) echo "::error::$t timed out after 300 s"; status=1 ;; *) echo "::error::$t failed"; status=1 ;; esac
          done
          exit $status
      - name: Agent-machinery tests
        working-directory: agent-machinery
        run: bun test
      - name: Automation browser download
        if: ${{ !cancelled() && steps.tools.outputs.browser-skip != '' }}
        env:
          REASON: ${{ steps.tools.outputs.browser-skip }}
        run: |
          echo "::error::$REASON"
          exit 1
