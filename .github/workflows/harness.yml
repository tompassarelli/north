name: Harness
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'harness/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'agent-machinery/**'
      - 'harness/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build harness commands
        run: |
          cargo build --locked
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Test tools
        run: |
          sudo apt-get install -y --no-install-recommends ripgrep shellcheck bubblewrap
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          git config --global init.defaultBranch main
          git config --global user.name socrates-ci
          git config --global user.email socrates-ci@example.invalid
      - name: Allow bubblewrap and unshare user namespaces
        run: |
          for tool in bwrap unshare; do
            sudo tee "/etc/apparmor.d/$tool" >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile $tool /usr/bin/$tool flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r "/etc/apparmor.d/$tool"
          done
          bwrap --unshare-net --ro-bind / / -- true
          unshare --user --map-current-user --pid --fork -- true
      - name: Install automation browser boundary
        working-directory: lib/automation-chrome
        timeout-minutes: 4
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright-core install --with-deps chromium
      - name: Shell and Python tests
        env:
          NORTH_HOME: ${{ github.workspace }}
          NORTH_PACE_BIN: ${{ github.workspace }}/target/debug/north
        run: |
          # Machine-bound: these need ~/code checkouts, a systemd user manager, /etc/codex/hooks/runtime, live agent state or shellcheck 0.11; they run locally.
          skip=(
            bin/agents-plan.test.sh bin/threads.test.sh
            bin/convo.test.sh
            bin/pin-retire.test.sh bin/run-bounded.test.sh
            harness/hooks/launch-critical-worktree-guard.test.sh
            harness/hooks/launch-critical-worktree-guard.test.py harness/hooks/lead-regrounding.test.sh
            harness/hooks/modern-search-guard.test.sh harness/hooks/native-launch-guard.test.sh
            harness/hooks/resource-safe-search-guard.test.sh harness/hooks/spawn-capacity-guard.test.sh
            harness/hooks/subagent-teardown.test.sh
            harness/hooks/worker-handoff.test.sh harness/hooks/worker-tier-guard.test.sh
            harness/hooks/worker-wait-guard.test.sh harness/hooks/session-kill-guard.test.sh
            harness/lib/routing.test.sh harness/scripts/agent-config-check.test.sh
            harness/skills/todo/scripts/cross-supervisor-mailbox.test.sh harness/skills/machine-capacity/scripts/machine-capacity.test.sh
          )
          mapfile -t tests < <(find bin lib harness -type f \( -name '*.test.sh' -o -name '*.test.py' \) 2>/dev/null | sort | grep -vxF -f <(printf '%s\n' "${skip[@]}"))
          if (( ${#tests[@]} == 0 )); then
            echo "No shell or Python tests under bin/, lib/ or harness/"
            exit 0
          fi
          logs="$RUNNER_TEMP/harness-tests"
          mkdir -p "$logs"
          printf '%s\0' "${tests[@]}" | xargs -0 -P "$(nproc)" -I{} bash -c '
            log="$0/$(printf %s "$1" | tr / _)" start=$SECONDS
            case "$1" in *.sh) timeout -k 10 300 bash "$1" ;; *.py) timeout -k 10 300 python3 "$1" ;; esac >"$log.log" 2>&1
            status=$?; echo "$status" >"$log.status"
            printf "%s exit %s after %ss\n" "$1" "$status" "$((SECONDS - start))"' "$logs" {}
          status=0
          for t in "${tests[@]}"; do
            log="$logs/$(printf %s "$t" | tr / _)"
            echo "::group::$t"
            cat "$log.log"
            echo "::endgroup::"
            case "$(cat "$log.status")" in 0) ;; 124|137) echo "::error::$t timed out after 300 s"; status=1 ;; *) echo "::error::$t failed"; status=1 ;; esac
          done
          exit $status
      - name: Install agent-machinery dependencies
        working-directory: agent-machinery
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          fi
      - name: Agent-machinery tests
        working-directory: agent-machinery
        run: bun test
