name: Cargo test environment
description: The bun, bubblewrap and gitleaks the cargo test suite drives, for every job that runs it.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.13
    - name: Sandbox boundary and scanner
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends bubblewrap
        curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
    - name: Allow bubblewrap user namespaces
      shell: bash
      run: |
        sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
        abi <abi/4.0>,
        include <tunables/global>
        profile bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
        }
        PROFILE
        sudo apparmor_parser -r /etc/apparmor.d/bwrap
        bwrap --unshare-net --ro-bind / / -- true
