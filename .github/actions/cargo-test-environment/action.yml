name: Cargo test environment
description: The bun, bubblewrap, betterleaks and ast-grep the cargo test suite drives, for every job that runs it.
inputs:
  dev-shell:
    description: The job's steps run in the Nix dev shell, which brings bun and ast-grep.
    default: 'false'
  fail-first-apt-attempt:
    description: Make the first apt attempt fail, to show the install survives it.
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.dev-shell != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ci-tools
        key: ci-tools-betterleaks-1.10.0-ast-grep-0.42.1
    - uses: ./.github/actions/system-tools
      with:
        packages: bubblewrap
        fail-first-apt-attempt: ${{ inputs.fail-first-apt-attempt }}
    - name: Scanner
      shell: bash
      env:
        DEV_SHELL: ${{ inputs.dev-shell }}
      run: |
        CI_TOOLS_SKIP_AST_GREP="$DEV_SHELL" bash "$GITHUB_ACTION_PATH/../ci-tools.sh"
    - name: Allow bubblewrap user namespaces
      shell: bash
      run: |
        sudo tee /etc/apparmor.d/bwrap >/dev/null <<PROFILE
        abi <abi/4.0>,
        include <tunables/global>
        profile bwrap $(realpath "$(command -v bwrap)") flags=(unconfined) {
          userns,
        }
        PROFILE
        sudo apparmor_parser -r /etc/apparmor.d/bwrap
        bwrap --unshare-net --ro-bind / / -- true
