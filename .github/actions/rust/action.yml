name: Rust toolchain
description: The toolchain rust-toolchain.toml pins, with the cargo cache and sccache on the Actions cache.
inputs:
  cache-key:
    description: Cargo cache key shared across jobs; empty keys the cache by job.
    default: ''
  save:
    description: Write the cargo and sccache caches; land checks run on per-lane refs that no later run can read, so they only read main's.
    default: 'true'
  rustup:
    description: Install the toolchain through rustup; a job in the Nix dev shell takes it from the flake instead.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Toolchain from rust-toolchain.toml
      if: inputs.rustup == 'true'
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - id: sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    - name: Compile through sccache, or without it when its download failed
      shell: bash
      env:
        SAVE: ${{ inputs.save }}
        SCCACHE: ${{ steps.sccache.outcome }}
      run: |
        {
          echo CARGO_INCREMENTAL=0
          if [ "$SCCACHE" = success ]; then
            echo SCCACHE_GHA_ENABLED=true
            echo RUSTC_WRAPPER=sccache
            [ "$SAVE" = true ] || echo SCCACHE_GHA_RW_MODE=READ_ONLY
          fi
        } >> "$GITHUB_ENV"
        [ "$SCCACHE" = success ] || echo "::warning::sccache did not install; compiling without it"
    - id: cargo-cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save }}
    - name: Dependencies the offline steps read, when the cache restore missed
      if: steps.cargo-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo fetch --locked
