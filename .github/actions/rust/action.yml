name: Rust toolchain
description: The toolchain rust-toolchain.toml pins, with the cargo cache and sccache on the Actions cache for workspace crates.
runs:
  using: composite
  steps:
    - name: Toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    - name: Compile through sccache
      shell: bash
      run: |
        {
          echo SCCACHE_GHA_ENABLED=true
          echo RUSTC_WRAPPER=sccache
          echo CARGO_INCREMENTAL=0
        } >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
