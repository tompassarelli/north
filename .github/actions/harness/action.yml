name: Harness test tools
description: The north build, system tools, namespaces and browser the shell and Python tests need.
inputs:
  force-slow-download:
    description: Run the browser download as if it were too slow, so its 2 s bound fails it.
    default: 'false'
  fail-first-apt-attempt:
    description: Make the first apt attempt fail, to show the install survives it.
    default: 'false'
  build:
    description: Build the north commands first; a job whose command builds them itself skips it.
    default: 'true'
outputs:
  browser-skip:
    description: Why the CDP boundary test was skipped, empty when the automation browser is available.
    value: ${{ steps.browser.outputs.skip }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4
    - name: Nix dev shell
      if: inputs.build == 'true'
      uses: ./.github/actions/nix-dev-shell
    - name: Build harness commands
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
      run: |
        [ "$BUILD" != true ] || nix develop --no-update-lock-file -c buck2 build //:north --out target/debug/north
        echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
    - uses: ./.github/actions/system-tools
      with:
        packages: ripgrep shellcheck bubblewrap
        fail-first-apt-attempt: ${{ inputs.fail-first-apt-attempt }}
    - name: Test tools
      shell: bash
      run: |
        bash "$GITHUB_ACTION_PATH/../ci-tools.sh"
        git config --global init.defaultBranch main
        git config --global user.name north-fleet-ci
        git config --global user.email north-fleet-ci@example.invalid
    - name: Allow bubblewrap and unshare user namespaces
      shell: bash
      run: |
        for tool in bwrap unshare; do
          sudo tee "/etc/apparmor.d/$tool" >/dev/null <<PROFILE
        abi <abi/4.0>,
        include <tunables/global>
        profile $tool $(realpath "$(command -v "$tool")") flags=(unconfined) {
          userns,
        }
        PROFILE
          sudo apparmor_parser -r "/etc/apparmor.d/$tool"
        done
        bwrap --unshare-net --ro-bind / / -- true
        unshare --user --map-current-user --pid --fork -- true
    - name: Install automation browser boundary
      shell: bash
      working-directory: lib/automation-chrome
      run: bun install --frozen-lockfile
    - name: Find installed automation browser
      id: installed
      shell: bash
      env:
        FORCE_SLOW: ${{ inputs.force-slow-download }}
      run: |
        if [ "$FORCE_SLOW" != true ] && { command -v google-chrome >/dev/null || command -v chromium >/dev/null; }; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache automation browser download
      if: steps.installed.outputs.present != 'true'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ms-playwright
        key: automation-browser-${{ runner.os }}-${{ hashFiles('lib/automation-chrome/bun.lock') }}
    - name: Download automation browser
      id: download
      if: steps.installed.outputs.present != 'true'
      continue-on-error: true
      shell: bash
      working-directory: lib/automation-chrome
      env:
        FORCE_SLOW: ${{ inputs.force-slow-download }}
      run: |
        limit=120
        [ "$FORCE_SLOW" = true ] && limit=2
        for subcommand in install install-deps; do
          timeout "$limit" bash -c '[ "$1" = true ] && sleep 600; exec bunx --no-install playwright-core "$2" chromium' _ "$FORCE_SLOW" "$subcommand"
        done
    - name: Record automation browser skip
      id: browser
      shell: bash
      run: |
        if [ "${{ steps.download.outcome }}" = failure ]; then
          reason="automation browser download failed or exceeded 120 s"
          echo "AUTOMATION_BROWSER_SKIP=$reason" >> "$GITHUB_ENV"
          echo "skip=$reason" >> "$GITHUB_OUTPUT"
          echo "::error::$reason; the CDP boundary test is skipped"
        fi
