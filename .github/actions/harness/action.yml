name: Harness test tools
description: The north build, system tools, namespaces and browser the shell, Python and agent-machinery tests need.
outputs:
  browser-skip:
    description: Why the CDP boundary test was skipped, empty when the automation browser is available.
    value: ${{ steps.browser.outputs.skip }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.13
    - uses: ./.github/actions/rust
    - name: Build harness commands
      shell: bash
      run: |
        cargo build --locked
        echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
    - name: Test tools
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends ripgrep shellcheck bubblewrap
        curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
        curl -fsSL -o "$RUNNER_TEMP/ast-grep.zip" https://github.com/ast-grep/ast-grep/releases/download/0.42.1/app-x86_64-unknown-linux-gnu.zip
        sudo unzip -o -q "$RUNNER_TEMP/ast-grep.zip" ast-grep -d /usr/local/bin
        git config --global init.defaultBranch main
        git config --global user.name socrates-ci
        git config --global user.email socrates-ci@example.invalid
    - name: Allow bubblewrap and unshare user namespaces
      shell: bash
      run: |
        for tool in bwrap unshare; do
          sudo tee "/etc/apparmor.d/$tool" >/dev/null <<PROFILE
        abi <abi/4.0>,
        include <tunables/global>
        profile $tool /usr/bin/$tool flags=(unconfined) {
          userns,
        }
        PROFILE
          sudo apparmor_parser -r "/etc/apparmor.d/$tool"
        done
        bwrap --unshare-net --ro-bind / / -- true
        unshare --user --map-current-user --pid --fork -- true
    - name: Install automation browser boundary
      shell: bash
      working-directory: lib/automation-chrome
      run: bun install --frozen-lockfile
    - name: Find installed automation browser
      id: installed
      shell: bash
      run: |
        if command -v google-chrome >/dev/null || command -v chromium >/dev/null; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache automation browser download
      if: steps.installed.outputs.present != 'true'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ms-playwright
        key: automation-browser-${{ runner.os }}-${{ hashFiles('lib/automation-chrome/bun.lock') }}
    - name: Download automation browser
      id: download
      if: steps.installed.outputs.present != 'true'
      continue-on-error: true
      shell: bash
      working-directory: lib/automation-chrome
      run: |
        timeout 120 bunx --no-install playwright-core install chromium
        timeout 120 bunx --no-install playwright-core install-deps chromium
    - name: Record automation browser skip
      id: browser
      shell: bash
      run: |
        if [ "${{ steps.download.outcome }}" = failure ]; then
          reason="automation browser download failed or exceeded 120 s"
          echo "AUTOMATION_BROWSER_SKIP=$reason" >> "$GITHUB_ENV"
          echo "skip=$reason" >> "$GITHUB_OUTPUT"
          echo "::error::$reason; the CDP boundary test is skipped"
        fi
    - name: Install agent-machinery dependencies
      shell: bash
      working-directory: agent-machinery
      run: |
        if [ -f bun.lock ] || [ -f bun.lockb ]; then
          bun install --frozen-lockfile
        fi
