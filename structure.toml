[[build_time]]
workspace = "."
leaf = "crates/north-code-health/src/code_health/source.rs"
hub = "crates/north-foundation/src/foundation/mod.rs"
test_no_run_seconds = 10
contention_ceiling = 0.5

[rust_habits]
checks = ["shared-mutability", "single-impl-trait", "ambient-test-input"]

[[rust_habits.ambient_inputs]]
input = "host"
allowlist = "ambient-test-inputs.tsv"
fixtures = ["tests/it/capacity_host/mod.rs"]
fixture = "pin the reading the code takes, as tests/it/capacity_host/mod.rs does with AGENT_CAPACITY_DISK_FREE_GIB, AGENT_CAPACITY_CORES, AGENT_CAPACITY_LOADAVG and AGENT_CAPACITY_MEMINFO"

[[rust_habits.ambient_inputs]]
input = "clock"
allowlist = "ambient-test-clocks.tsv"
fixtures = []
fixture = "take time as a value from an injected clock and order events by waiting on them (a channel, a barrier, a file the code under test writes); a wait that only bounds a test that would otherwise hang goes through north_base::platform::wait::until"

[[rust_habits.ambient_inputs]]
input = "fleet"
allowlist = "ambient-test-fleets.tsv"
fixtures = ["crates/north-dispatch/src/dispatch/queued.rs", "crates/north-land-scans/src/peer_invocations_tests.rs", "crates/north-runtime/src/runtime/probe_tests.rs"]
fixture = "start it in a tempdir and set NORTH_TEST_ROOT to that directory before the launch, as tests/it/fleet_launch.rs and tests/it/land_serve/mod.rs do, so a write outside it is refused before the session or lander writes; each file in fixtures only reads the words and starts no process"

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-fleet-supervisor/src/fleet/registry/fixtures.rs"
reason = "Test fixture, doc(hidden) and public since 895bb0e6f so north-tui's tests reach it; a fake session's frames are shared between its reader thread and the test."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-session-host/src/session_host.rs"
reason = "Activity, the prompt counter and the frame watcher are shared between the stdin writer and stdout reader threads of one session."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-fleet-supervisor/src/fleet/registry/hand_in.rs"
reason = "A thread's held delivery locks, so a hand-in nested in one it already holds, such as a revive's carry-on, shares the lock instead of flocking the same file again and waiting on itself; the guard cannot be passed down the prompt, revive and send chain between them (north#637)."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-fleet-supervisor/src/fleet/registry/start_lock.rs"
reason = "A thread's held start locks, so a take-over holding a name's lock across archiving the old session and starting the new one shares it with the stop and first-turn delivery nested inside, instead of flocking the same file again and waiting on itself; the guard cannot be passed down the archive, halt, prompt and wake chain between them (north#1017)."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-threads/src/threads/board/issues.rs"
reason = "rusqlite needs &mut Connection for transactions while Board hands out &self reads."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "src/bin/verify_north/notes.rs"
reason = "One driver stdin pipe written from the observer threads of verify-north."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-fleet/src/fleet/books.rs"
item = "WatchBooks"
reason = "Trait alias bundling the RunSink, Books, ReceiptBook and GateBook ports through a blanket impl; each port has its own test double."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-fleet/src/fleet/books.rs"
item = "FleetBooks"
reason = "Trait alias over WatchBooks and GateBook through a blanket impl; each port has its own test double."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-fleet-supervisor/src/fleet/test_support.rs"
item = "Internals"
reason = "Test seam behind the test-support feature: north-core's Claude-runtime fleet tests reach Fleet's crate-private accessors through it, so they stay crate-private in production."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-landing-gates/src/land_abandon/scratch.rs"
item = "Witness"
reason = "north-landing cannot depend on the root crate's fleet reader that implements it."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-concerns/src/history.rs"
item = "Store"
reason = "Port for the concern history: keeps north-concerns, which the landing's after-checks also run, free of north-threads and SQLite; the root crate wires the threads ledger behind it."

[[module]]
name = "registries"
paths = ["crates/north-registries/src/**", "build.rs"]
responsibility = "Read a generated registry's per-unit source tree and render the registry the build and the lander write."
may_use = ["crate-roots"]

[[crate_dag.crate]]
name = "north-registries"
layer = 1
paths = ["crates/north-registries/src/**"]
may_use = []
[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-runtime/src/runtime/watch.rs"
reason = "the canary reads the ledger's lifecycle_moves rows in one read-only SQL count; the state names are the stored column values, never held or written as state here (north#722)"
[[implicit_state.allow]]
shape = "status-string"
path = "src/bin/verify_north/journey.rs"
reason = "the outcome is the runs table's text column read back from the scratch ledger to check the journey, never held as state (north#722)"
[[implicit_state.allow]]
shape = "phase-suffix"
path = "crates/north-shared-config/src/lib.rs"
reason = "the suffix names the temporary file a stamp is written to before its atomic rename, a file name and not a lifecycle phase (north#722)"
[[crate_dag.crate]]
name = "north-test-cases"
layer = 1
paths = ["crates/north-test-cases/src/**"]
may_use = []

[[module]]
name = "test_cases"
paths = ["crates/north-test-cases/src/**"]
responsibility = "Run one libtest binary's cases one process each, as nextest does, and print a status line per case, so a Buck2 test target reports per-test verdicts."
may_use = []

[[crate_dag.crate]]
name = "north-monitor"
layer = 7
paths = ["crates/north-tui/monitor/src/**"]
may_use = ["north-shared-config", "north-base"]
[[module]]
name = "monitor"
paths = ["crates/north-tui/monitor/src/**"]
responsibility = "Render one live terminal screen of fleet, landing queue, runtime versions per host, health and ladder level from the cheapest direct source of each number, each read off the render thread with a timeout, so a broken north still shows what is broken."
may_use = ["crate-roots", "platform", "platform.records", "platform.host_load"]
[[module]]
name = "evals"
paths = ["evals/**"]
responsibility = "Measurement runners that drive north and other harnesses from outside, as a user would: the Eval B load ladder against plain T3 Code, the Eval T case list, two-harness case runner, first-request reader and thread-transfer fixture for T3 Code's own measures, the file-prediction scorer for first prompts, with the replay of experiment G1 over closed north boxes, and the host glue that runs Terminal-Bench 2 through its own harness for Eval X."
may_use = []
[[module]]
name = "dispatch_pause_lifecycle"
paths = ["crates/north-base/src/dispatch_pause_lifecycle.rs"]
responsibility = "The dispatch pause's phase as one lifecycle machine: held by hand, held by a cause check, held until an expiry, or lifted, the states the pause record in dispatch_pause.rs is written and removed through."
may_use = ["foundation", "lifecycle"]

[[crate_dag.crate]]
name = "north-docs"
paths = ["crates/north-docs/src/**"]
may_use = ["north-registries"]

[[crate_dag.crate]]
name = "north-offload"
paths = ["crates/north-offload/src/**"]
may_use = ["north-base", "north-build-system", "north-capacity-host", "north-dispatch", "north-lanes", "north-pacing", "north-runtime-follow"]

[[module]]
name = "docs"
paths = ["crates/north-docs/src/**"]
responsibility = "The north docs command: each generated index and the per-unit source tree it is written from."
may_use = ["crate-roots", "registries"]

[[crate_dag.crate]]
name = "north-timers"
layer = 6
paths = ["crates/north-timers/src/**"]
may_use = ["north-base", "north-dispatch", "north-providers"]
