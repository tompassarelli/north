[thresholds]
file_lines = 500
function_lines = 60
function_complexity = 15
hotspot_top = 10

[crate_lines]
default = 25000
hub = 10000
hub_dependents = 3

[crate_dag]
re_exports = ["crates/*/src/lib.rs"]

[[crate_dag.crate]]
name = "north-strategy-types"
paths = ["crates/north-strategy-types/src/**"]
may_use = []

[[crate_dag.crate]]
name = "north-base"
paths = ["crates/north-base/src/**"]
may_use = ["north-strategy-types"]

[[crate_dag.crate]]
name = "north-landing"
paths = ["crates/north-landing/src/**"]
may_use = ["north-base", "north-github-mirror", "north-goals"]

[[crate_dag.crate]]
name = "north-safe-push"
paths = ["crates/north-safe-push/src/**"]
may_use = ["north-base", "north-landing"]

[[crate_dag.crate]]
name = "north-tui"
paths = ["crates/north-tui/src/**"]
may_use = ["north-providers"]

[[crate_dag.crate]]
name = "north-guard"
paths = ["crates/north-guard/src/**", "crates/*/src/lanes.rs", "crates/*/src/lanes/**", "crates/*/src/code_health.rs", "crates/*/src/code_health/**"]
may_use = ["north-dispatch", "north-providers", "north-github-mirror", "north-graph-ground"]

[[crate_dag.crate]]
name = "north-capacity-host"
paths = ["crates/*/src/capacity/host.rs", "crates/*/src/capacity/host/**", "crates/*/src/capacity/gate.rs", "crates/*/src/capacity/gate/**", "crates/*/src/capacity/gate_tests.rs", "crates/*/src/capacity/watchdog.rs", "crates/*/src/capacity/watchdog/**", "crates/north-capacity-host/src/**"]
may_use = ["north-capacity", "north-fleet", "north-threads"]

[[crate_dag.crate]]
name = "north-capacity"
paths = ["crates/*/src/capacity.rs", "crates/*/src/capacity/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-github-mirror"
paths = ["crates/north-github-mirror/src/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-goals"
paths = ["crates/north-goals/src/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-coverage"
paths = ["crates/north-coverage/src/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-graph"
paths = ["crates/north-graph/src/**"]
may_use = []

[[crate_dag.crate]]
name = "north-graph-ingest"
paths = ["crates/north-graph-ingest/src/**"]
may_use = ["north-base", "north-coverage", "north-fleet", "north-github-mirror", "north-graph", "north-threads"]

[[crate_dag.crate]]
name = "north-graph-ground"
paths = ["crates/north-graph-ground/src/**"]
may_use = ["north-base", "north-graph"]

[[crate_dag.crate]]
name = "north-dispatch"
paths = ["crates/north-dispatch/src/**"]
may_use = ["north-capacity", "north-fleet", "north-providers", "north-threads", "north-github-mirror"]

[[crate_dag.crate]]
name = "north-replay"
paths = ["crates/north-replay/src/**"]
may_use = ["north-base", "north-capacity", "north-dispatch", "north-landing"]

[[crate_dag.crate]]
name = "north-runtime"
paths = ["crates/north-runtime/src/**"]
may_use = ["north-capacity-host", "north-dispatch", "north-providers"]

[[crate_dag.crate]]
name = "north-ops"
paths = ["crates/*/src/ops.rs", "crates/*/src/ops/**", "crates/*/src/health.rs", "crates/*/src/health/**"]
may_use = ["north-dispatch", "north-threads", "north-github-mirror"]

[[crate_dag.crate]]
name = "north-pace"
paths = ["crates/*/src/pace.rs", "crates/*/src/pace/**", "crates/*/src/router.rs", "crates/*/src/router/**", "crates/*/src/usage.rs", "crates/*/src/usage/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-threads"
paths = ["crates/*/src/threads.rs", "crates/*/src/threads/**", "crates/*/src/work_items.rs", "crates/*/src/work_items/**"]
may_use = ["north-pace"]

[[crate_dag.crate]]
name = "north-fleet"
paths = ["crates/*/src/fleet.rs", "crates/*/src/fleet/**", "crates/*/src/claude_stream.rs", "crates/*/src/claude_stream/**"]
may_use = ["north-pace"]

[[crate_dag.crate]]
name = "north-providers"
paths = ["crates/*/src/providers.rs", "crates/*/src/providers/**", "crates/*/src/codex.rs", "crates/*/src/codex/**", "crates/*/src/ledger.rs", "crates/*/src/ledger/**"]
may_use = ["north-fleet", "north-threads"]

[[crate_dag.crate]]
name = "north-core"
paths = ["crates/north-core/src/**"]
may_use = ["north-fleet", "north-graph-ground", "north-threads"]

[review]
commits = 600
hand_lines_added = 20000
days = 3
hotspot_score = 0

[ignore]
paths = ["target/**", "src/fixtures/**", "crates/*/src/fixtures/**", "**/node_modules/**", "harness/**/fixtures/**", "crates/north-pace/src/router/fixtures/**"]

[[module]]
name = "tests"
thresholds = { file_lines = 1200, function_lines = 150, function_complexity = 30 }
paths = ["tests/**", "crates/*/tests/**", "examples/**", "src/**/tests.rs", "src/**/*_tests.rs", "crates/*/src/**/tests.rs", "crates/*/src/**/*_tests.rs", "src/bin/fake_claude.rs", "src/fixtures/*.rs", "crates/north-guard/src/guard/launch_critical_fixtures.rs"]
responsibility = "Journeys, goldens, property inputs and the fake runtime."
may_use = ["strategy_types", "cli", "tui", "providers", "ledger", "fleet", "guard", "threads", "landing", "catalog", "grounding", "capacity", "lanes", "ops", "usage", "code_health", "build_time", "learn", "domain", "shell", "platform", "foundation", "crate-roots", "proxy", "split", "landing.safe_push.entry", "landing.safe_push.gates", "landing.safe_push.landing", "landing.safe_push.mode", "landing.safe_push.publication", "landing.safe_push.report", "landing.safe_push.request", "landing.safe_push.restore", "landing.safe_push.session", "landing.safe_push.shell", "landing.safe_push.tags", "github_mirror", "coverage", "verdict_cache", "graph", "graph_ingest"]

[[module]]
