[review]
commits = 600
hand_lines_added = 20000
days = 3
hotspot_score = 0
hidden_links = 2
volatile_imports = 2
special_cases = 40

[ignore]
paths = ["target/**", "src/fixtures/**", "crates/*/src/fixtures/**", "**/node_modules/**", "harness/**/fixtures/**", "crates/north-pace/src/router/fixtures/**"]

[[module]]
name = "tests"
thresholds = { file_lines = 1200, function_lines = 150, function_complexity = 30 }
paths = ["tests/**", "crates/*/tests/**", "examples/**", "crates/*/examples/**", "src/**/tests.rs", "src/**/*_tests.rs", "crates/*/src/**/tests.rs", "crates/*/src/**/*_tests.rs", "src/bin/fake_claude.rs", "src/bin/push_trace_git.rs", "src/fixtures/*.rs", "crates/north-guard/src/guard/launch_critical_fixtures.rs"]
responsibility = "Journeys, goldens, property inputs and the fake runtime."
may_use = ["agent_starts", "strategy_types", "mutants", "cli", "tui", "providers", "ledger", "fleet", "guard", "threads", "landing", "catalog", "grounding", "capacity", "lanes", "ops", "usage", "code_health", "build_time", "learn", "domain", "shell", "foundation", "crate-roots", "proxy", "split", "landing.safe_push.entry", "landing.safe_push.gates", "landing.safe_push.landing", "landing.safe_push.mode", "landing.safe_push.publication", "landing.safe_push.report", "landing.safe_push.request", "landing.safe_push.restore", "landing.safe_push.session", "landing.safe_push.shell", "landing.safe_push.tags", "github_mirror", "coverage", "verdict_cache", "graph", "graph_ingest", "lander-doctor", "replay", "concerns", "graph_ground", "nix_upkeep", "lifecycle", "implicit_state", "land_ticket", "build_inputs", "platform.git", "platform.process", "platform.records", "platform", "platform.github", "platform.ssh", "platform.harness", "fleet_store", "graph_loops", "graph_change", "git_locks", "broker", "machine_model", "verify", "build_system", "monitor", "rust_files", "runtime_follow"]

[[module]]
name = "git_locks"
paths = ["crates/north-git-locks/src/**"]
responsibility = "Stale git lock files: the one removal an agent may make in a primary checkout's git directory."
may_use = []

[[module]]
name = "build_system"
paths = ["crates/north-build-system/src/**"]
responsibility = "The one interface north builds, lists and runs Rust tests, type-checks and mutates a workspace through, with its Cargo and Buck2 sides and the per-host choice between them."
may_use = ["crate-roots", "platform", "platform.host", "platform.harness"]

[[module]]
name = "runtime_follow"
paths = ["crates/north-runtime-follow/src/**"]
responsibility = "How a long-lived north process moves onto the runtime its link promotes, and the tree layout, current runtime and collection of the runtimes it moves between."
may_use = ["platform.git", "platform.harness", "platform.process"]

[[module]]
name = "buck"
paths = ["crates/north-buck/src/**"]
responsibility = "The Buck2 targets of the workspace crates, written from cargo metadata and the Cargo manifests so the two build graphs cannot drift."
may_use = []
[[module]]
name = "broker"
paths = ["crates/north-broker/src/**"]
responsibility = "The credential broker: a per-uid policy ceiling, scoped GitHub App installation tokens, allowlisted cloud calls forwarded with the credential swapped in, and the owner's private repository creation."
may_use = ["foundation", "platform", "platform.process", "runtime_follow"]

[[module]]
name = "strategy_types"
paths = ["crates/north-strategy-types/src/**"]
responsibility = "The decision records the kernel writes and strategies read: one Case and one Decision per decision kind, and the brief vocabulary, token counts and api-spend snapshot the pace and store crates share."
may_use = []

[[module]]
name = "replay"
paths = ["crates/north-replay/src/**"]
responsibility = "Strategy replay: the logged decision cases decided again by the linked code, their outcome counts beside the logged ones, and the declared invariants checked over the replayed decisions."
may_use = ["capacity", "crate-roots", "foundation", "landing", "ops", "strategy_types", "lifecycle", "platform.records", "platform.git", "platform.harness"]

[[module]]
name = "lander-doctor"
paths = ["crates/north-lander-doctor/src/**"]
responsibility = "The lander doctor: each lander health bound read live, the known remedy for each stuck state, the last lander build that landed a batch green and the rollback to it, and one proxy page per unknown state."
may_use = ["crate-roots", "foundation", "landing", "lifecycle", "land_ticket", "platform.records", "platform.git", "platform.harness", "platform.ssh", "graph_loops"]

[[module]]
