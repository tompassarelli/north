[thresholds]
file_lines = 500
function_lines = 60
function_complexity = 15
hotspot_top = 10

[crate_lines]
default = 25000
hub = 10000
hub_dependents = 3

[crate_dag]
re_exports = ["crates/*/src/lib.rs"]

[[crate_dag.crate]]
name = "north-base"
paths = ["crates/north-base/src/**"]
may_use = []

[[crate_dag.crate]]
name = "north-landing"
paths = ["crates/north-landing/src/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-tui"
paths = ["crates/north-tui/src/**"]
may_use = ["north-providers"]

[[crate_dag.crate]]
name = "north-guard"
paths = ["crates/north-guard/src/**", "crates/*/src/lanes.rs", "crates/*/src/lanes/**", "crates/*/src/code_health.rs", "crates/*/src/code_health/**"]
may_use = ["north-dispatch", "north-providers"]

[[crate_dag.crate]]
name = "north-capacity-host"
paths = ["crates/*/src/capacity/host.rs", "crates/*/src/capacity/host/**", "crates/*/src/capacity/gate.rs", "crates/*/src/capacity/gate/**", "crates/*/src/capacity/gate_tests.rs", "crates/*/src/capacity/watchdog.rs", "crates/*/src/capacity/watchdog/**", "crates/north-capacity-host/src/**"]
may_use = ["north-capacity", "north-fleet", "north-threads"]

[[crate_dag.crate]]
name = "north-capacity"
paths = ["crates/*/src/capacity.rs", "crates/*/src/capacity/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-dispatch"
paths = ["crates/north-dispatch/src/**"]
may_use = ["north-capacity", "north-fleet", "north-providers", "north-threads"]

[[crate_dag.crate]]
name = "north-runtime"
paths = ["crates/north-runtime/src/**"]
may_use = ["north-capacity-host", "north-dispatch", "north-providers"]

[[crate_dag.crate]]
name = "north-ops"
paths = ["crates/*/src/ops.rs", "crates/*/src/ops/**", "crates/*/src/health.rs", "crates/*/src/health/**"]
may_use = ["north-dispatch", "north-threads"]

[[crate_dag.crate]]
name = "north-pace"
paths = ["crates/*/src/pace.rs", "crates/*/src/pace/**", "crates/*/src/router.rs", "crates/*/src/router/**", "crates/*/src/usage.rs", "crates/*/src/usage/**"]
may_use = ["north-base"]

[[crate_dag.crate]]
name = "north-threads"
paths = ["crates/*/src/threads.rs", "crates/*/src/threads/**", "crates/*/src/work_items.rs", "crates/*/src/work_items/**"]
may_use = ["north-pace"]

[[crate_dag.crate]]
name = "north-fleet"
paths = ["crates/*/src/fleet.rs", "crates/*/src/fleet/**", "crates/*/src/claude_stream.rs", "crates/*/src/claude_stream/**"]
may_use = ["north-pace"]

[[crate_dag.crate]]
name = "north-providers"
paths = ["crates/*/src/providers.rs", "crates/*/src/providers/**", "crates/*/src/codex.rs", "crates/*/src/codex/**", "crates/*/src/ledger.rs", "crates/*/src/ledger/**"]
may_use = ["north-fleet", "north-threads"]

[[crate_dag.crate]]
name = "north-core"
paths = ["crates/north-core/src/**"]
may_use = ["north-fleet", "north-threads"]

[review]
commits = 600
hand_lines_added = 20000
days = 3
hotspot_score = 0

[ignore]
paths = ["target/**", "src/fixtures/**", "crates/*/src/fixtures/**", "**/node_modules/**", "harness/**/fixtures/**", "crates/north-pace/src/router/fixtures/**"]

[[module]]
name = "tests"
thresholds = { file_lines = 1200, function_lines = 150, function_complexity = 30 }
paths = ["tests/**", "crates/*/tests/**", "examples/**", "src/**/tests.rs", "src/**/*_tests.rs", "crates/*/src/**/tests.rs", "crates/*/src/**/*_tests.rs", "src/bin/fake_claude.rs", "src/fixtures/*.rs", "crates/north-guard/src/guard/launch_critical_fixtures.rs"]
responsibility = "Journeys, goldens, property inputs and the fake runtime."
may_use = ["cli", "tui", "providers", "ledger", "fleet", "guard", "threads", "landing", "catalog", "grounding", "capacity", "lanes", "ops", "usage", "code_health", "build_time", "learn", "domain", "shell", "platform", "foundation", "crate-roots", "proxy", "split"]

[[module]]
name = "foundation"
paths = ["crates/north-base/src/foundation/**", "crates/north-base/src/error.rs", "crates/north-base/src/test_inputs.rs", "crates/north-base/src/build_inputs.rs"]
responsibility = "Error type, clock port and time values, identifiers."
may_use = []

[[generated]]
paths = ["harness/skills/machine-capacity/scripts/machine-capacity.mjs"]
producer = "harness/skills/machine-capacity/scripts/build-machine-capacity"

[[module]]
name = "platform"
paths = ["crates/north-base/src/platform/**"]
responsibility = "Adapters for processes, git, GitHub, SQLite, files and ssh."
may_use = ["foundation"]

[[module]]
name = "shell"
paths = ["crates/north-base/src/shell/**", "crates/north-base/src/shellcmd.rs", "crates/north-base/src/nix_command.rs"]
responsibility = "One shell lexer and segmenter, and one Nix command reader, for every guard and gate."
may_use = ["foundation"]

[[module]]
name = "domain"
paths = ["crates/north-core/src/domain/**", "crates/*/src/pace/**", "crates/*/src/router.rs", "crates/*/src/router/**"]
responsibility = "Workforce members, messages, briefs, work-item refs, routing, pace and placement policy."
may_use = ["foundation", "crate-roots"]

[[module]]
name = "fleet"
paths = ["crates/north-core/src/fleet/**", "crates/north-core/src/lead_journal.rs"]
responsibility = "Headless agent sessions: Runtime port, installed runtime binaries, process host, delivery journal, admission, supervision."
may_use = ["domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "ledger"
paths = ["crates/north-core/src/ledger/**"]
responsibility = "Run ledger: fleet turn records, artifact-bound task verdicts, cost and estimate queries."
may_use = ["fleet", "domain", "platform", "foundation", "crate-roots", "threads"]

[[module]]
name = "guard"
paths = ["crates/north-guard/src/lib.rs", "crates/north-guard/src/guard/**", "crates/north-guard/src/hook.rs"]
responsibility = "Tool-call policy over provider-neutral ToolCall values."
may_use = ["ledger", "fleet", "autoland_status", "ops", "usage", "capacity", "shell", "domain", "platform", "foundation", "crate-roots", "code_health", "lanes", "threads"]

[[module]]
name = "threads"
paths = ["crates/north-core/src/threads/**", "crates/north-core/src/work_items.rs"]
responsibility = "NorthThreads ledger: items, holders, runs, messages, jobs, remote host access."
may_use = ["domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "autoland_status"
paths = ["crates/north-base/src/autoland_status.rs", "crates/north-base/src/autoland_status/**"]
responsibility = "Autoland run evidence and lane holds read by landing and the guards."
may_use = ["platform", "foundation"]

[[module]]
name = "landing"
paths = ["crates/north-landing/src/landing/**", "crates/north-landing/src/dep_gate.rs", "crates/north-landing/src/language_gate.rs", "crates/north-landing/src/build_cache_gate.rs", "crates/north-landing/src/build_cache_gate_tests.rs", "crates/north-landing/src/stub_exec_gate.rs", "crates/north-landing/src/stub_exec_gate_tests.rs", "crates/north-landing/src/runtime_floor_gate.rs", "crates/north-landing/src/runtime_floor_gate_tests.rs", "crates/north-landing/src/language_gate/**", "crates/north-landing/src/provenance.rs", "crates/north-landing/src/issue_body.rs", "crates/north-landing/src/issue_box_lint.rs", "crates/north-landing/src/land_abandon.rs", "crates/north-landing/src/land_abandon/**", "crates/north-landing/src/follows_release.rs", "crates/north-landing/src/land/**", "crates/north-landing/src/watch/**"]
responsibility = "Landing to main and its gates: dependency, language, provenance, boxes, autoland, follows."
may_use = ["shell", "autoland_status", "threads", "domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "catalog"
paths = ["crates/north-core/src/catalog/**", "crates/north-core/src/agent_catalog.rs", "crates/north-core/src/agent_policy_contract.rs", "crates/north-core/src/agent_policy_contract/**", "crates/north-core/src/agent_config_check/**"]
responsibility = "Agent catalog, activation generations, projection port and policy checks."
may_use = ["domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "proxy"
paths = ["crates/north-core/src/proxy/**"]
responsibility = "Classify the proxy's tool calls by kind from the verb table the CLI declares, and read them out of a transcript."
may_use = ["crate-roots", "foundation", "shell"]

[[module]]
name = "grounding"
paths = ["crates/north-core/src/grounding/**"]
responsibility = "Index and retrieval of existing infrastructure and history for prompts."
may_use = ["threads", "domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "capacity"
paths = ["crates/north-core/src/capacity/**", "crates/north-capacity-host/src/capacity/**", "crates/north-capacity-host/src/lib.rs"]
responsibility = "Machine capacity leases, admission, watchdog and the game-reserve slice."
may_use = ["shell", "platform", "foundation", "crate-roots", "fleet", "threads"]

[[module]]
name = "lanes"
paths = ["crates/north-guard/src/lanes/**"]
responsibility = "Worktree and pin lifecycle: reap, rescue, gc, layout checks."
may_use = ["threads", "platform", "foundation", "crate-roots"]

[[module]]
name = "ops"
paths = ["crates/north-ops/src/lib.rs", "crates/north-ops/src/ops/**", "crates/north-core/src/health.rs", "crates/north-core/src/health/**", "crates/north-runtime/src/agent_contain/**", "crates/north-runtime/src/build_offload/**", "crates/north-runtime/src/job_watch/**", "crates/north-runtime/src/land_offload/**", "crates/north-runtime/src/laptop_ntfy/**", "crates/north-runtime/src/laptop_runner/**", "crates/north-runtime/src/lib.rs", "crates/north-runtime/src/model_watch/**", "crates/north-runtime/src/outside_watch/**", "crates/north-runtime/src/runtime/**", "crates/north-runtime/src/runtime_access.rs", "crates/north-runtime/src/timers/**", "crates/north-runtime/src/usage_web_read/**", "crates/north-dispatch/src/check/**", "crates/north-dispatch/src/dispatch/**", "crates/north-dispatch/src/dividend/**", "crates/north-dispatch/src/laptop/**", "crates/north-dispatch/src/lib.rs", "crates/north-dispatch/src/pacing/**", "crates/north-dispatch/src/resident_cap/**", "crates/north-dispatch/src/tune/**"]
responsibility = "Operational commands: health, watchers, jobs, infra placement, chat, convo, code-health, runtime update."
may_use = ["ledger", "fleet", "threads", "capacity", "usage", "domain", "shell", "platform", "foundation", "crate-roots", "providers"]

[[module]]
name = "usage"
paths = ["crates/*/src/usage/**"]
responsibility = "Account usage readings: the latest reading of each account window from the threads ledger."
may_use = ["domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "code_health"
paths = ["crates/north-guard/src/code_health/**"]
responsibility = "Import resolution for the code-health report, gate and edit check; the Rust habit checks; the hourly review tick."
may_use = ["platform", "foundation", "crate-roots"]

[[module]]
name = "split"
paths = ["crates/north-core/src/split/**"]
responsibility = "north split move-module: moves modules out of one workspace crate into a sibling crate, byte-identical, with its manifest, re-exports and structure entry."
may_use = ["crate-roots", "foundation", "platform"]

[[module]]
name = "build_time"
paths = ["crates/north-core/src/build_time/**"]
responsibility = "Measured Rust edit-to-result times per workspace, their ledger and the 10 s leaf-edit cap."
may_use = ["platform", "foundation", "crate-roots"]

[[module]]
name = "learn"
paths = ["crates/north-core/src/learn/**"]
responsibility = "Replay, tuning, measurement and backtests over recorded outcomes."
may_use = ["threads", "domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "providers"
paths = ["crates/north-core/src/providers/**", "crates/north-core/src/claude_stream.rs", "crates/north-core/src/contract_probe.rs", "crates/north-core/src/daemon.rs", "crates/north-core/src/usage_stream.rs", "crates/north-core/src/codex.rs", "crates/north-core/src/rpc.rs"]
responsibility = "Claude, Codex and agy adapters: launch, streams, app-server, accounts, usage, hooks, projection."
may_use = ["fleet", "guard", "catalog", "threads", "domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "tui"
paths = ["crates/north-tui/src/lib.rs", "crates/north-tui/src/tui/**"]
responsibility = "Fleet terminal screen, input, transcript and digest views."
may_use = ["fleet", "catalog", "domain", "platform", "foundation", "crate-roots"]

[[module]]
name = "cli"
thresholds = { file_lines = 500, function_lines = 150, function_complexity = 26 }
paths = ["src/main.rs", "src/cli/**"]
responsibility = "Argument tree, exit codes, and wiring of provider adapters into ports."
may_use = ["tui", "autoland_status", "providers", "ledger", "fleet", "guard", "threads", "landing", "catalog", "grounding", "capacity", "lanes", "ops", "usage", "code_health", "build_time", "learn", "domain", "shell", "platform", "foundation", "crate-roots", "proxy", "split"]

[[module]]
name = "verify"
paths = ["src/bin/verify_north/**"]
responsibility = "verify-north: build north, then launch, drive, observe and clean up the real fleet TUI and CLI through tmux."
may_use = []

[[module]]
name = "js-survivors"
paths = ["lib/automation-chrome/**", "agent-machinery/**"]
responsibility = "Playwright automation and the agent-machinery JS package."
may_use = []

[[module]]
name = "ts-legacy"
thresholds = { file_lines = 1400 }
paths = ["harness/**/*.ts", "harness/**/*.mjs", "bin/**/*.ts"]
responsibility = "TypeScript awaiting a Rust port; may not grow."
may_use = []

[[module]]
name = "crate-roots"
paths = ["crates/*/src/lib.rs"]
responsibility = "Crate roots: module declarations and the re-exports that keep crate:: paths stable across the workspace split."
may_use = ["foundation", "platform", "shell", "autoland_status", "domain", "usage"]

