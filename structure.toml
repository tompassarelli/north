[[module]]
name = "verify"
paths = ["src/bin/verify_north/**"]
responsibility = "verify-north: build north, then walk the spine (brief, worker, landed commit, ledger row) on a scratch repository and clean up."
may_use = ["lifecycle", "build_system"]

[[module]]
name = "js-survivors"
paths = ["lib/automation-chrome/**", "harness/skills/effect-development/scripts/**"]
responsibility = "Playwright automation and the Effect kit, which run inside the JavaScript tools they drive."
may_use = []

[[module]]
name = "ts-legacy"
thresholds = { file_lines = 1400 }
paths = ["harness/**/*.ts", "bin/**/*.ts"]
responsibility = "TypeScript awaiting a Rust port; may not grow."
may_use = []

[[module]]
name = "crate-roots"
paths = ["crates/*/src/lib.rs"]
facade = true
responsibility = "Crate roots: module declarations and the re-exports that keep crate:: paths stable across the workspace split."
may_use = ["foundation", "shell", "autoland_status", "domain", "usage", "threads", "fleet", "providers"]

