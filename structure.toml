[[build_time]]
workspace = "."
leaf = "crates/north-code-health/src/code_health/source.rs"
hub = "crates/north-base/src/foundation/mod.rs"
test_no_run_seconds = 10
contention_ceiling = 0.5

[rust_habits]
checks = ["shared-mutability", "single-impl-trait", "ambient-test-input"]

[[rust_habits.ambient_inputs]]
input = "host"
allowlist = "ambient-test-inputs.tsv"
fixtures = ["tests/it/capacity_host/mod.rs"]
fixture = "pin the reading the code takes, as tests/it/capacity_host/mod.rs does with AGENT_CAPACITY_DISK_FREE_GIB, AGENT_CAPACITY_CORES, AGENT_CAPACITY_LOADAVG and AGENT_CAPACITY_MEMINFO"

[[rust_habits.ambient_inputs]]
input = "clock"
allowlist = "ambient-test-clocks.tsv"
fixtures = []
fixture = "take time as a value from an injected clock and order events by waiting on them (a channel, a barrier, a file the code under test writes); a wait that only bounds a test that would otherwise hang goes through north_base::platform::wait::until"

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-lander/src/land/serve.rs"
reason = "Serve carries the serve loop's methods on Lander, which north-landing defines; an inherent impl outside its crate is E0116, so the methods live on a trait in the crate that uses them (north#840)."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-lander/src/land/serve/batch.rs"
reason = "Batching carries the batch round's methods on Lander, which north-landing defines; an inherent impl outside its crate is E0116 (north#840)."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-lander/src/land/serve/round.rs"
reason = "Probing carries the probe round's methods on Lander, which north-landing defines; an inherent impl outside its crate is E0116 (north#840)."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-fleet-supervisor/src/fleet/registry/fixtures.rs"
reason = "Test fixture, doc(hidden) and public since 895bb0e6f so north-tui's tests reach it; a fake session's frames are shared between its reader thread and the test."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-session-host/src/session_host.rs"
reason = "Activity, the prompt counter and the frame watcher are shared between the stdin writer and stdout reader threads of one session."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-fleet-supervisor/src/fleet/registry/hand_in.rs"
reason = "A thread's held delivery locks, so a hand-in nested in one it already holds, such as a revive's carry-on, shares the lock instead of flocking the same file again and waiting on itself; the guard cannot be passed down the prompt, revive and send chain between them (north#637)."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-fleet-supervisor/src/fleet/registry/start_lock.rs"
reason = "A thread's held start locks, so a take-over holding a name's lock across archiving the old session and starting the new one shares it with the stop and first-turn delivery nested inside, instead of flocking the same file again and waiting on itself; the guard cannot be passed down the archive, halt, prompt and wake chain between them (north#1017)."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-flow/src/flow/jobs.rs"
reason = "Memo of fetched run jobs behind a &self read API; candidate for &mut self."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-flow/src/flow/measure.rs"
reason = "Lazy claim and stranded caches behind a &self Env shared by every measure; candidate for &mut self."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "crates/north-threads/src/threads/board/issues.rs"
reason = "rusqlite needs &mut Connection for transactions while Board hands out &self reads."

[[rust_habits.allow]]
rule = "shared-mutability"
path = "src/bin/verify_north/notes.rs"
reason = "One driver stdin pipe written from the observer threads of verify-north."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-fleet/src/fleet/books.rs"
item = "WatchBooks"
reason = "Trait alias bundling the RunSink, Books, ReceiptBook and GateBook ports through a blanket impl; each port has its own test double."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-fleet/src/fleet/books.rs"
item = "FleetBooks"
reason = "Trait alias over WatchBooks and GateBook through a blanket impl; each port has its own test double."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-session-host/src/session_host.rs"
item = "SentLog"
reason = "Keeps the process host free of the turn watcher's parsing; candidate to make concrete."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-fleet-supervisor/src/fleet/test_support.rs"
item = "Internals"
reason = "Test seam behind the test-support feature: north-core's Claude-runtime fleet tests reach Fleet's crate-private accessors through it, so they stay crate-private in production."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-landing-gates/src/land_abandon/scratch.rs"
item = "Witness"
reason = "north-landing cannot depend on the root crate's fleet reader that implements it."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "src/cli/fleet/desktop/mod.rs"
item = "Opener"
reason = "The desktop port north#733 asked for: the take-over decides when to show a proxy, and the compositor and terminal stay behind it, with niri and ghostty as its one adapter until another desktop is wanted."

[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-session-host/src/session_host.rs"
item = "FrameWatch"
reason = "Keeps the process host free of the turn watcher's parsing, as SentLog does; candidate to make concrete."


[[rust_habits.allow]]
rule = "single-impl-trait"
path = "crates/north-goals/src/history.rs"
item = "Store"
reason = "Port for the concern history: keeps north-goals, which the landing's after-checks also run, free of north-threads and SQLite; the root crate wires the threads ledger behind it."
