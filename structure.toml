[thresholds]
file_lines = 500
function_lines = 60
function_complexity = 15
hotspot_top = 10

[implicit_state]
owners = ["crates/north-base/src/lifecycle.rs", "crates/north-base/src/lifecycle/"]
typed = "north_base::lifecycle (one Lifecycle enum per state, written only through lifecycle::Store)"

[[implicit_state.allow]]
shape = "presence-flag"
path = "crates/north-capacity-host/src/capacity/depbox.rs"
item = "cargo-fetched/*"
reason = "one empty file per Cargo.lock fingerprint records that its crates were fetched on this host; the landing's crate fetch reads and writes the same files, and a missing one only costs one cargo fetch"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-providers/src/providers/claude/window_inbox.rs"
reason = "the status of a Claude Code window is read from the session file Claude Code writes, an external format with no north lifecycle behind it"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-providers/src/providers/claude/runs/row.rs"
reason = "the outcome is the text a run row stores in the runs table, ranked here as it is read and never held as state"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-threads/src/threads/runs/record.rs"
reason = "the run status is a field of the hook payload and the outcome the text column of the runs table, both external formats read once per record"

[[implicit_state.allow]]
shape = "phase-suffix"
path = "crates/north-threads/src/threads/runs/hook_rules.rs"
reason = "privacy-judge.pending is the name of one refusal rule in the guard table, a dotted rule name and not a phase"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-base/src/foundation/check_log.rs"
reason = "exited and was killed are words of a land check's log line, an external text format read once to find the failed check, never held as state (moved from red_check.rs, north#917)"

[[implicit_state.allow]]
shape = "status-string"
path = "src/cli/scoreboard/workers.rs"
reason = "the run outcome is the text column the ledger's runs table stores, read here as rows and never held as state"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-base/src/platform/land_notice.rs"
reason = "the verdict is a line parsed from the lander's report text, an external format"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-tune/src/loops/red_main.rs"
reason = "the run status and conclusion are fields of the GitHub workflow-runs response, an external format with no north lifecycle behind it"

[[implicit_state.allow]]
shape = "phase-suffix"
path = "crates/north-threads/src/threads/runs/hook_rules.rs"
reason = "the dotted names are guard rule ids in a classification table, labels for refusal text and never a lifecycle phase"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-land-scans/src/withdrawal.rs"
reason = "the verdict is the text a queue record stores for a decided ticket; the withdrawn-by prefix is read once per refusal from that stored record and never held as state (north#722)"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-flow/src/tempo/mod.rs"
reason = "the verdict is the text column of a queue record, counted once per reading for the failed-interaction tally and never held as state (north#722)"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-lander/src/land/serve/batch.rs"
reason = "the pick's verdict is the lander's report line, parsed here once to decide whether the lane's cleanup report runs, and never held as state (north#722)"

[[implicit_state.allow]]
shape = "status-string"
path = "crates/north-fleet-supervisor/src/fleet/strays.rs"
reason = "the status is the text column of a session-table row, read once per sweep and never held as state (north#722)"

[[implicit_state.allow]]
shape = "status-string"
path = "src/cli/scoreboard/chain.rs"
reason = "the outcome is the text column the ledger's runs table stores, read here as rows and never held as state (north#722)"

