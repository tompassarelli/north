change = "A job of a session the coordinator launched urgent takes the front of a build host's slot line, behind only a red fix, whether it is offloaded from the session's scope or brokered for a sandboxed session's offload or hand-in gate; it is off while the coordinator launches no session with --priority urgent. Judged on first-commit minutes because the registry's metric list has no per-rank slot-line wait metric"
landed = "85e719b1ac"
metric = "first_commit_p50_minutes"
direction = "down"
bar = 5.0
min_n = 15
before = ["2026-10-30", "2026-11-13"]
after = ["2026-11-13", "2026-11-18"]
review = "2026-11-20"
owner = "tompassarelli/north#1036"

[[check]]
id = "n637-day-without-timeouts"
box = "shows no start timeout for a day after it lands"
command = "journalctl --user -u fleet-tick.service --since -24h | rg -c 'start operation timed out' || echo 0"
expect = "0"
review = "2026-11-07"
owner = "tompassarelli/north#1048"

[[check]]
id = "n638-mirror-main-caller"
box = "An hour of GitHub calls attributed by caller (from the broker's call log) shows the mirror as the main caller"
command = "f='awk -F \"\\t\" -v s=$(( $(date +%s) - 3600 )) \"\\$1>=s && \\$3==\\\"upstream\\\" && \\$4!=304 && \\$6!~/^\\\\/rate_limit/ {print \\$2}\" \"${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/north-gh-broker/calls.log\"'; { sh -c \"$f\"; for h in nexus gex45 ccx33; do ssh -o BatchMode=yes -o ConnectTimeout=10 $h \"$f\" || echo \"!$h\"; done; } | sort | uniq -c | sort -rn | awk 'NR<=6{print} NR==1{top=$2} $2~/^!/{bad=1} END{exit !(top==\"north-github-mirror.service\" && !bad)}'"
review = "2026-11-07"
owner = "tompassarelli/north#638"

[[check]]
id = "n638-no-bypass-hour"
box = "The measured hour: the personal token's core use is under 1,500"
command = "f='awk -F \"\\t\" -v s=$(( $(date +%s) - 3600 )) \"\\$1>=s && \\$3==\\\"upstream\\\" && \\$4!=304 && \\$6!~/^\\\\/(graphql|rate_limit)/ && \\$2 ~ /(\\\\.service|\\\\.scope)\\$|^[0-9]+\\$/ {print \\$2}\" \"${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/north-gh-broker/calls.log\"'; { sh -c \"$f\"; for h in nexus gex45 ccx33; do ssh -o BatchMode=yes -o ConnectTimeout=10 $h \"$f\" || echo \"!$h\"; done; } | sort | uniq -c | sort -rn | awk '{n+=$1} NR<=6{print} NR==1{top=$2} $2~/^!/{bad=1} END{print \"total \" n; exit !(top==\"north-github-mirror.service\" && !bad && n<1500)}'"
review = "2026-11-07"
owner = "tompassarelli/north#638"

[[check]]
id = "n634-evict-keeps-land-slot"
box = "Item: disk eviction keeps the lander's warm land-offload slot"
command = "ssh -o BatchMode=yes -o ConnectTimeout=10 gex45 'journalctl --user --since -24h -o short | awk \"/north capacity: evicted/ { p=\\$5; if (\\$0 ~ /idle build output|compiler cache/) trimmed[p]=1; else if (\\$0 ~ /land-offload/ && !trimmed[p]) { bad++; last=\\$0 } } END { print last; print bad+0 \\\" land-offload slots evicted with no cargo-target or sccache trim in the same reaper run\\\"; exit bad>0 }\"'"
review = "2026-11-07"
owner = "tompassarelli/north#634"

[[check]]
