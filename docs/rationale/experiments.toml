# One entry per live policy or routing change. `north check experiments judge --file` (run by the
# agents-flow-stall timer through `north ledger flow --stall-alarm`) judges each entry on its review day
# and files the verdict once on its owner issue; `north check experiments` refuses a landing whose
# rationale review rule (an `Overturned by:` paragraph or a `## Review` section) no entry quotes.
#
# metric: a north ledger flow outcome metric over finished worker runs (rework_rate, first_commit_p50_minutes,
# landed, runs), incident_rows_per_week with a class (that incidents-ledger class's rows per 7 days, every
# card in harness/nix/cards.toml needing exactly one), or none with a measure naming how the rule is judged instead
# (always re-measure).
# bar: the move toward `direction`, in the metric's units, that keeps the change; a move as large
# the other way reverts it, and anything between goes to Tom, except a `climb-` entry the policy loop
# registered, which it extends on too few samples or settles at min_n itself. Without `before` the baseline is 0.
# Days are UTC, windows [start, end), and review falls at least 2 days after `after` ends.

[[experiment]]
id = "failing-first"
change = "A bug fix lands with a test seen failing on the code before the fix; a refactor declares Behavior: unchanged"
landed = "1885127c6"
note = "docs/rationale/failing-first.md"
rule = "Two weeks after adoption (north#524), compare from the ledger the rework (reverts, follow-up fixes, red-main culprits) of fix lanes with and without a failing-first test over 2026-11-04 to 2026-11-18, and keep, change or drop the rule on that result."
metric = "rework_rate"
direction = "down"
bar = 0.02
min_n = 15
before = ["2026-10-21", "2026-11-04"]
after = ["2026-11-04", "2026-11-16"]
review = "2026-11-18"
owner = "tompassarelli/north#524"

