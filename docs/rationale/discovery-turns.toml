# One `[[turn]]` per mechanism-discovery turn, appended by the turn that ran it and never edited afterwards.
# The brief is harness/mechanism-discovery/turn-brief.md; the scan that refuses any other change is `turn-scope`.

[[turn]]
date = 2026-11-12
loss = "scoreboard:first-try-success"
figure = "worker first-try success 59% (1,180 of 2,006) this week, against 69% the week before (north dash --weekly)"
explanation_a = "The mix changed: the newly armed DeepSeek and Gemini families take first attempts and close about a fifth of them, which moves the blended figure."
explanation_b = "The count is polluted: text-judge calls are recorded as failed worker runs."
separating = "Four queries over the ledger's run rows of the last 7 days: first attempts (no Follows:) and outcome done or not done, counted with the scoreboard's worker rule (ROLE_SQL). Under A the two families carry most of the fall; under B the non-worker rows carry it."
survivor = "A holds within the week: 442 of 1,972 first attempts are the two new families and 100 of them are done, about a fifth. B is refuted: 81 Gemini rows with no category were not done, the worker rule already reads 72 of them as judge calls, so pollution explains at most 9 rows. The week-before comparison is not established by this count, which reads 57% for that week where the scoreboard reads 69%."
owned = "none"
mechanism = "none filed: the per-family first-try print is proposed, not built, and is listed as an idea under tompassarelli/north#1279"
registry = "none: no mechanism was built, so no discovery- entry is registered"

[[turn]]
date = 2026-11-13
loss = "first-try-lost:provider error"
figure = "44 of 1,772 first tries lost to provider error in 168 h to 2026-11-13T15:54Z, the largest of 85 harness losses (north dash losses --since 7d); 28 read 'OpenCode Go 5 hour usage limit', 10 'Free usage limit reached', 5 'Cancelled a request for input ... Web Search', 1 'inference service is overloaded'"
explanation_a = "The route carries the loss: runs on the free model id (opencode/deepseek-v4.1-flash-free) hit a quota ceiling of their own, so the lost first tries all sit on that route and runs on the paid Go model id (opencode-go/deepseek-v4.1-flash) lose almost none at the same launch volume."
explanation_b = "The volume carries the loss: the Go plan's 5-hour window is exhausted by how many opencode sessions launch in it, whichever model id they name, so losses follow the trailing-5-hour launch count and the Go-model id loses at the same rate once volume is as high."
separating = "north dash losses --since 7d for the 44 rows, joined by session name to north ledger runs --json (provider opencode, model id, exit), then for every opencode run its trailing-5-hour opencode launch count (all routes). Under A every joined lost run names the free model id and, among runs at 40 or more launches in the trailing 5 h, the Go-model runs fail at a small fraction of the free-model rate. Under B the Go-model runs fail at about the free-model rate at that volume."
survivor = "A. 35 of the 44 rows join to run rows and all 35 are the free model id (32 failed, 3 completed after retry); the other 9 (from 2026-11-11 22:47Z, 2026-11-12 and 2026-11-13) have no run row, so they carry the route only by their text (free usage limit, web-search cancel). At 40 or more launches in the trailing 5 h, free-model runs failed 119 of 685 (17%), Go-model runs 3 of 213 (1.4%), with the peak trailing count the same on both (294 and 291), which refutes B. The Go 5-hour message appears on free-model sessions, so it names the account's window, not the route that spent it. Every opencode run since 2026-11-11 05:00Z is the Go model id (all completed or killed, none failed), and c42af2b6b1 (2026-11-13 11:12Z) routes public-repository boxes to the Go model unless a launch names the free one; the 3 free-limit rows at 2026-11-13 15:52Z show the free id is still named by some launches. Not separated: whether the 9 run-less rows ever reached a run row."
owned = "none: no open issue lists provider errors on the opencode free route; north#1041 owns the outside-provider road and north#259 the Claude usage-limit stops"
mechanism = "none filed: the route fix (c42af2b6b1) landed before this turn and was not built from it; the 9 launch-time losses with no run row are an idea under tompassarelli/north#1041"
registry = "none: the surviving mechanism pre-dates the turn and no bar on a class or repository it was not built from can be set from these rows"
