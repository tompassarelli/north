[package]
name = "north-capacity-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[lib]
doctest = false

[dependencies]
north-runtime-follow = { path = "../north-runtime-follow" }
north-base = { path = "../north-base" }
north-capacity = { path = "../north-capacity" }
north-graph-loops = { path = "../north-graph-loops" }
north-fleet-store = { path = "../north-fleet-store" }
north-threads = { path = "../north-threads", features = ["test-support"] }
regex.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
tokio.workspace = true
north-foundation = { path = "../north-foundation" }



[dev-dependencies]
north-capacity = { path = "../north-capacity", features = ["test-support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
