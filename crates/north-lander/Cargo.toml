[package]
name = "north-lander"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[lib]
doctest = false

[dependencies]
north-runtime-follow = { path = "../north-runtime-follow" }
north-git-locks = { path = "../north-git-locks" }
north-base = { path = "../north-base" }
north-check-environment = { path = "../north-check-environment" }
north-concerns = { path = "../north-concerns" }
north-land-scans = { path = "../north-land-scans" }
north-land-sandbox = { path = "../north-land-sandbox" }
north-landing = { path = "../north-landing" }
north-offload = { path = "../north-offload" }
north-strategy-types = { path = "../north-strategy-types" }
north-trusted-mirror = { path = "../north-trusted-mirror" }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true

[lints]
workspace = true

[dev-dependencies]
landlock = "0.4.7"
north-machine-model = { path = "../north-machine-model" }

[[package.metadata.north.buck.host-cases]]
name = "land::shadow::run::tests::a_queued_check_line_starts_detached_and_is_recorded_once_it_ends"
reason = "waits 10 s for a detached check line to write its pid file, which on a slowed hosted runner it did not: hosted run 43683254262 failed it after 34 s, while it passes in 2.0 s on a build host (north#1537)"
