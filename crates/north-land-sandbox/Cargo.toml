[package]
name = "north-land-sandbox"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[lib]
doctest = false

[[bin]]
name = "north-land-sandbox"
path = "src/main.rs"

[dependencies]
north-base = { path = "../north-base" }
landlock = "0.4"
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["process", "ptrace", "signal"] }
rustix = { workspace = true }
seccompiler = { version = "0.5", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
