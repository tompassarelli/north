[package]
name = "north-providers"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[dependencies]
north-claude-stream = { path = "../north-claude-stream" }
north-base = { path = "../north-base" }
north-pace = { path = "../north-pace" }
north-calibration = { path = "../north-calibration" }
north-threads = { path = "../north-threads", features = ["test-support"] }
north-fleet-supervisor = { path = "../north-fleet-supervisor" }
north-graph = { path = "../north-graph" }
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
time.workspace = true
sha2.workspace = true
toml_edit.workspace = true

[dev-dependencies]
landlock = "0.4.7"
north-runtime = { path = "../north-runtime" }
north-fleet-supervisor = { path = "../north-fleet-supervisor", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[[package.metadata.north.buck.host-cases]]
name = "an_opencode_worker_in_a_public_lane_cannot_read_south_or_sops_keys"
reason = "runs a command in the worker sandbox's Landlock domain, which cannot execute a program it wrote inside a remote worker's build directory"
test = "opencode_lane"
