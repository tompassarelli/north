title = "north secret scan"

[extend]
useDefault = false

[allowlist]
description = "build outputs, caches, generated records and vendored upstream sources"
paths = [
  '''(^|/)target/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.direnv/''',
  '''(^|/)result(-[a-z]+)?(/|$)''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)(flake\.lock|bun\.lock|package-lock\.json)$''',
  '''^repos/effect/''',
  '''(?i)\.(jpe?g|png|gif|webp|ico|mp4|webm|woff2?|ttf|otf|pdf|blp|m3d|w3x|w3m)$''',
]

[[rules]]
id = "age-secret-key"
description = "age private key"
regex = '''AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'''
keywords = ["age-secret-key-1"]

[[rules]]
id = "private-key"
description = "PEM or OpenSSH private key block, covering ssh keys, GitHub App keys and sops key files"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,40}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?-----END[ A-Z0-9_-]{0,40}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["private key-----"]

[[rules]]
id = "github-token"
description = "GitHub personal, OAuth, user, server or refresh token"
regex = '''\bgh[pousr]_[A-Za-z0-9]{36,255}\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub fine-grained personal access token"
regex = '''\bgithub_pat_[A-Za-z0-9_]{82}\b'''
keywords = ["github_pat_"]

[[rules]]
id = "hetzner-token"
description = "Hetzner Cloud or Robot API token named by its variable"
regex = '''(?i)(?:hcloud|hetzner|robot)[A-Za-z0-9_.-]{0,40}(?:token|key|secret|password|pass)["']?\s{0,3}[:=]\s{0,3}["']?([A-Za-z0-9]{64})\b'''
secretGroup = 1
keywords = ["hcloud", "hetzner", "robot"]

[[rules]]
id = "digitalocean-token"
description = "DigitalOcean personal access, OAuth or refresh token"
regex = '''\bdo[por]_v1_[a-f0-9]{64}\b'''
keywords = ["_v1_"]

[[rules]]
id = "cloudflare-token"
description = "Cloudflare API token or global key named by its variable"
regex = '''(?i)(?:cloudflare|cf)[A-Za-z0-9_.-]{0,40}(?:token|key)["']?\s{0,3}[:=]\s{0,3}["']?([A-Za-z0-9_-]{37,40})\b'''
secretGroup = 1
keywords = ["cloudflare", "cf_", "cf-"]

[[rules]]
id = "cloudflare-origin-ca-key"
description = "Cloudflare Origin CA key"
regex = '''\bv1\.0-[a-f0-9]{24}-[a-f0-9]{146}\b'''
keywords = ["v1.0-"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API, admin or OAuth key"
regex = '''\bsk-ant-(?:api|admin|oat|ort)\d{2}-[A-Za-z0-9_-]{60,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "nix-hashed-password"
description = "Hashed password in Nix config"
regex = '''hashedPassword\s*=\s*"[^"]{10,}"'''
path = '''\.nix$'''
keywords = ["hashedpassword"]

[[rules]]
id = "nix-plaintext-password"
description = "Plaintext password in Nix config"
regex = '''(?i)(?:password|passwd|pass)\s*=\s*"[^"]{4,}"'''
path = '''\.nix$'''
keywords = ["password", "passwd", "pass"]

[[rules]]
id = "wifi-psk"
description = "WiFi pre-shared key in Nix config"
regex = '''(?i)(?:psk|pre.?shared.?key|wifi.?password)\s*=\s*"[^"]{8,}"'''
path = '''\.nix$'''
keywords = ["psk", "shared", "wifi"]
