# Alerts of north's four alarm sources, each labelled by whether it was right (north#706).
# label: "acted" a person or session had to act on it; "false" it cleared with no action, or a later reading contradicted it.
# `north alarm stats` prints each source's false share from these rows within its window, and lists each source over 10% false with
# the `narrowed` line of its newest false row, or "not narrowed". The alerts column counts the source's messages in the log
# `alarms.jsonl` beside the fleet's state, written by every `north fleet send` from the source; it starts with the lane that added it.
# Add a row for each alert a reviewer reads, true ones too, so the share is a rate and not a count of the false ones found.
# The 2026-11-08 rows are the alerts that day's fixes (north#706) record by their commit messages; no acted-on row is labelled yet.

