[package]
name = "north-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[package.metadata.north.buck]
test-resources = ["//:tree"]

[dependencies]
north-runtime-follow = { path = "../north-runtime-follow" }
north-offload = { path = "../north-offload" }
north-build-system = { path = "../north-build-system" }
north-base = { path = "../north-base" }
north-lanes = { path = "../north-lanes" }
north-providers = { path = "../north-providers" }
north-dispatch = { path = "../north-dispatch" }
regex.workspace = true
percent-encoding.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
base64.workspace = true
toml_edit.workspace = true
tokio.workspace = true
landlock = "0.4.7"

[dev-dependencies]
north-pacing = { path = "../north-pacing", features = ["test-support"] }

[lints]
workspace = true

