# run preloads libfaketime without the faketime wrapper, which waits for every descendant such as a spare a test leaves running, and runs the tests' rustc outside it, since rustc's jemalloc deadlocks in libfaketime's constructor; it fakes utimensat so set_modified is not shifted twice, leaves CLOCK_MONOTONIC and shared memory alone so timed waits and sandbox records hold, and skips find, which compares unshifted mtimes
[target.x86_64-unknown-linux-gnu]
runner = ["shifted-clock/run", "+0d"]
