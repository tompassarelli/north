# libfaketime shifts CLOCK_MONOTONIC and stat mtimes but not utimensat unless told, which hangs timed waits and double-shifts set_modified, and find reads unshifted mtimes against a shifted clock
[target.x86_64-unknown-linux-gnu]
runner = ["env", "FAKE_UTIME=1", "FAKETIME_DONT_FAKE_MONOTONIC=1", "FAKETIME_SKIP_CMDS=find", "faketime", "--disable-shm", "+400 days"]
