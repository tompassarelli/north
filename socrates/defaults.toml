[success_threshold]
value = 80
unit = "percent of runs that succeed (threads run_ok)"
source = "provisional: no measurement or Tom decision found; workers notes.md calls it an experiment"
fallback = "a tier under min_runs runs is unsampled: recommend uses default_tier, routing uses the orchestration.toml band"
consumers = ["bin/threads", "socrates/lib/routing.py"]

[min_runs]
value = 5
unit = "runs in a cell before its success rate counts"
source = "provisional: no measurement or Tom decision found; the Wilson 95% lower bound (policy_stats.wilson) now carries small-n uncertainty when no tier passes"
fallback = "back off surface, verify, scope, spec to the category cell, then default_tier"
consumers = ["bin/threads", "socrates/lib/plan_usage.py"]

[incumbent_margin]
value = 15
unit = "success points a dearer challenger must gain over a cell's incumbent"
source = "provisional: no measurement or Tom decision found"
fallback = "with no incumbent the cheapest passing tier is picked"
consumers = ["bin/threads"]

[default_tier]
value = "claude:opus-medium"
unit = "tier key"
source = "tom: south agents/orchestration.toml tiers.claude:opus-medium, hand-edited by Tom: 'The default Opus worker for the whole top range'"
fallback = "used when no tier in the cell has min_runs runs, or when no tier passes and it is unsampled"
consumers = ["bin/threads"]

[eta_min_samples]
value = 3
unit = "timed runs before recommend prints a cell's ETA"
source = "provisional: no measurement or Tom decision found"
fallback = "back off to the category cell; below it the ETA is n/a and the brief says (uncalibrated)"
consumers = ["bin/threads"]

[eta_coverage]
value = 0.75
unit = "quantile of actual/predicted the calibrated ETA scale covers"
source = "provisional: north35-design.md lane A target (feedback-lead), not a Tom decision; live row: threads calibrate kind eta_pred, 2026-10-12, n=1889, p75 0.96"
fallback = "below calibration_thin_n runs or older than calibration_stale_days the ETA is unscaled and marked (uncalibrated)"
consumers = ["bin/threads"]

[calibration_thin_n]
value = 5
unit = "runs behind a calibration row before readers apply it"
source = "provisional: same floor as min_runs, no separate measurement"
fallback = "readers use the uncalibrated rule and print (uncalibrated: n < floor)"
consumers = ["socrates/lib/calibration.py"]

[calibration_stale_days]
value = 7
unit = "days before a calibration row is too old to apply"
source = "tom: 2026-10-12 policy-lead-status.md item 20 (via tom-48): project shares are rolling 7-day $, the window every loop measures over"
fallback = "readers use the uncalibrated rule and print (uncalibrated: older than 7 days)"
consumers = ["socrates/lib/calibration.py"]

[calibrate_after_min]
value = 55
unit = "minutes since the newest calibration row before the tick precheck recalibrates"
source = "tom: 2026-10-12 policy-lead-status.md item 18 (via tom-48): the loop reads usage hourly; 55 keeps it under the hourly tick"
fallback = "no calibration row at all recalibrates on the next tick"
consumers = ["socrates/lib/tick_precheck.py"]

[overdue_ratio]
value = 2
unit = "multiple of a claim's or worker's ETA before it flags OVERDUE or OVERTIME"
source = "measured: runs minutes/eta_min (threads calibrate kind eta), workers, 7d to 2026-10-12, n=969, p90 1.30, p95 1.87, 4.1% over 2x"
fallback = "a claim or worker with no ETA never flags by ratio; overtime_min still applies"
consumers = ["bin/threads", "bin/worker-sweep"]

[overtime_min]
value = 45
unit = "minutes a worker runs before the leash nudge and OVERTIME flag"
source = "measured: runs.minutes of done worker runs, 7d to 2026-10-12, n=1191, p75 20, p90 40, p95 69, 8.5% over 45"
fallback = "applies to every worker whatever its ETA"
consumers = ["bin/worker-sweep", "socrates/hooks/worker-handoff.sh"]

[stall_idle_min]
value = 10
unit = "minutes without a transcript event before a running worker flags STALLED"
source = "measured: gaps between consecutive events in Claude worker transcripts, 3d to 2026-10-12, 745 transcripts, n=185808 gaps, p99 0.97 min, p99.9 10.01 min, 202 gaps of 10+ min"
fallback = "a worker with no transcript event is not flagged"
consumers = ["bin/worker-sweep"]

[stale_idle_min]
value = 300
unit = "minutes idle past which the tick precheck treats a STALLED worker as abandoned"
source = "provisional: no measurement or Tom decision found"
fallback = "below it a STALLED worker stays in the tick's sweep reduction"
consumers = ["socrates/lib/tick_precheck.py"]

[handoff_ctx]
value = 350000
unit = "context tokens before a Claude worker is told to hand off"
source = "measured: runs.peak_ctx of Claude worker runs (firn#19 telemetry), 14d to 2026-10-12, n=966, p95 315k, p99 412k; done rate 58% under 200k, 18% at 300-350k, 19% at 350-400k, 0% over 400k (n=14); 3 compactions in 966 runs"
fallback = "a run without usage records reports peak_ctx 0 and is never flagged"
consumers = ["socrates/hooks/worker-handoff.sh", "bin/capacity-watchdog", "bin/worker-sweep"]

[usage_stale_min]
value = 30
unit = "minutes before a usage readout is too old to route on"
source = "measured: gaps between usage window readouts per account, 7d to 2026-10-12, n=294, p50 13, p95 16 min; 30 is two missed readouts"
fallback = "a stale or missing readout is billed 'unknown' and only warns, never holds a spawn"
consumers = ["socrates/lib/routing.py", "socrates/lib/usage.py"]

[money_ceiling]
value = 95
unit = "percent of an account's window used before overflow may cost money"
source = "provisional: no measurement or Tom decision found"
fallback = "an account with no readout is priced as unknown"
consumers = ["socrates/lib/routing.py"]

[fast_floor]
value = 10
unit = "percent headroom every window keeps before fast mode is allowed"
source = "tom: 2026-10-12 policy-lead-status.md item 13 (via tom-48): Codex drains to 10-20%, never below the band"
fallback = "no window readout means no fast mode"
consumers = ["socrates/lib/routing.py"]

[codex_floor]
value = 10
unit = "percent Codex left at Friday 23:59 ET under which Astra fallback is refused"
source = "tom: 2026-10-12 policy-lead-status.md item 13 (via tom-48): drain Codex to about 15% (10-20%)"
fallback = "no Friday projection uses current headroom"
consumers = ["socrates/lib/routing.py"]

[astra_cost]
value = 5
unit = "percent of the Codex week one Astra fallback is assumed to cost"
source = "provisional: no measurement or Tom decision found"
fallback = "Astra is unavailable when the projection is unknown"
consumers = ["socrates/lib/routing.py"]

[late_ratio]
value = 1.5
unit = "project urgency u at which the only admitted tier may run fast"
source = "provisional: no measurement or Tom decision found"
fallback = "a project without a target has u 1.0 and never qualifies"
consumers = ["socrates/lib/routing.py"]

[capacity_min]
value = 15
unit = "minutes a provider-capacity error keeps the provider unavailable"
source = "provisional: no measurement or Tom decision found"
fallback = "no capacity error means the provider is available"
consumers = ["socrates/lib/routing.py"]

[explore_runs]
value = 10
unit = "worker runs under which a tier is explorable"
source = "provisional: workers notes.md recheck after every 10 closures, no Tom decision found"
fallback = "a tier without a run count is not explorable"
consumers = ["socrates/lib/routing.py"]

[explore_every]
value = 5
unit = "every Nth staffing slot is an explore slot"
source = "provisional: no measurement or Tom decision found"
fallback = "with no explorable tier the slot staffs normally"
consumers = ["socrates/lib/routing.py"]

[successor_days]
value = 7
unit = "days within which a tier's announced successor holds exploration"
source = "tom: 2026-10-12 policy-lead-status.md item 20 (via tom-48): rolling 7-day windows"
fallback = "a tier with no model_events successor is never held"
consumers = ["socrates/lib/routing.py"]

[successor_p]
value = 0.6
unit = "probability a successor ships before exploration is held"
source = "provisional: no measurement or Tom decision found"
fallback = "a tier with no model_events successor is never held"
consumers = ["socrates/lib/routing.py"]

[priority_headroom]
value = 0.2
unit = "share of the CPU limit a lower-priority project's spawns leave free"
source = "provisional: no measurement or Tom decision found"
fallback = "a project with no priority rank uses the whole limit"
consumers = ["socrates/hooks/lib/spawn_capacity.py"]

[capacity_sizing_runs]
value = 20
unit = "newest matching runs machine-capacity sizes a command from"
source = "provisional: no measurement or Tom decision found"
fallback = "under 3 matching runs the declared resource class applies"
consumers = ["socrates/skills/machine-capacity/scripts/machine-capacity-logic.ts", "socrates/skills/machine-capacity/scripts/machine-capacity-host.mjs"]

[capacity_memory_margin]
value = 1.2
unit = "multiple of p90 peak memory machine-capacity charges"
source = "measured: capacity_runs exact signatures walk-forward, peak memory / p90 of the prior 20, to 2026-10-12, n=27, p99 1.02, none over 1.2"
fallback = "under 3 matching runs the declared resource class applies"
consumers = ["socrates/skills/machine-capacity/scripts/machine-capacity-logic.ts", "socrates/skills/machine-capacity/scripts/machine-capacity-host.mjs"]

[capacity_high_confidence_runs]
value = 10
unit = "exact-signature runs before a capacity estimate is high confidence"
source = "provisional: no measurement or Tom decision found"
fallback = "fewer exact runs give medium confidence; no match gives low"
consumers = ["socrates/skills/machine-capacity/scripts/machine-capacity-logic.ts"]

[pace_target_left_claude]
value = 5
unit = "percent a Claude account keeps at its weekly reset when orchestration.toml sets none"
source = "tom: 2026-10-12 policy-lead-status.md item 18 (via tom-48): Claude accounts drain steadily to about 5% at reset"
fallback = "orchestration.toml accounts.claude.target_left overrides it"
consumers = ["socrates/lib/plan_usage.py"]

[pace_target_left_codex]
value = 15
unit = "percent Codex keeps at Friday 23:59 ET when orchestration.toml sets none"
source = "tom: 2026-10-12 policy-lead-status.md item 13 (via tom-48): drain Codex to about 15% (10-20%) by end of Friday US Eastern"
fallback = "orchestration.toml accounts.codex.target_left overrides it"
consumers = ["socrates/lib/plan_usage.py"]

[pace_band]
value = [10, 20]
unit = "percent left band; a Thursday projection above the top flags drain_behind"
source = "tom: 2026-10-12 policy-lead-status.md item 13 (via tom-48): 10-20%, never above 20%, flag on Thursday"
fallback = "orchestration.toml accounts.<provider>.band overrides it"
consumers = ["socrates/lib/plan_usage.py", "socrates/lib/routing.py"]
